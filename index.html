<style>
:root{--bg:#d8dccb;--panel:#e6e9da;--field:#f1f3e8;--ink:#1d2417;--muted:#525c49;--line:#b3baa2;--tallow:#6f4f08;--blood:#8a2b22;--kin:#3d6a2a;--bead1:#dd7563;--bead2:#7a1f17}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11140e;--panel:#1b2016;--field:#151911;--ink:#e3e0cc;--muted:#a0a58f;--line:#363d2b;--tallow:#e2b04a;--blood:#dc6552;--kin:#9bbd6f;--bead1:#e88a77;--bead2:#8a2b20}}
:root[data-theme="dark"]{--bg:#11140e;--panel:#1b2016;--field:#151911;--ink:#e3e0cc;--muted:#a0a58f;--line:#363d2b;--tallow:#e2b04a;--blood:#dc6552;--kin:#9bbd6f;--bead1:#e88a77;--bead2:#8a2b20}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.fell,h1,h2,h3{font-family:"IM Fell English","Iowan Old Style",Georgia,serif;font-weight:400;margin:0;line-height:1.15}
.wrap{max-width:1060px;margin:0 auto;padding:24px 16px 64px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px double var(--line);padding-bottom:14px}
h1{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;font-size:clamp(36px,7vw,58px);letter-spacing:.03em}
.ask{margin:6px 0 0;color:var(--muted);font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:19px}
.camp{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.camp label{color:var(--muted);font-size:15px}
.title-input{font:inherit;font-family:"IM Fell English",Georgia,serif;font-size:22px;color:var(--ink);background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:3px;padding:2px 6px;min-width:0;width:min(320px,100%)}
.title-input:hover{border-color:var(--line)}
.title-input:focus{background:var(--field);border-color:var(--tallow)}
.ledger{display:flex;gap:22px;font-size:15px;color:var(--muted)}
.ledger b{display:block;font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:26px;color:var(--ink);line-height:1.1}
.brand{display:flex;align-items:center;gap:14px}
.crest{flex:none;width:58px;height:58px}
nav{display:flex;gap:4px;margin:14px 0 24px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;font:inherit;font-size:17px;color:var(--muted);border-bottom:2px solid transparent;border-radius:0;cursor:pointer;min-height:44px}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tallow)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer;min-height:44px}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.warn{border-color:var(--blood);color:var(--blood)}
button.lnk{background:none;border:0;padding:6px 2px;min-height:36px;color:var(--tallow);text-decoration:underline}
button.lnk:disabled{color:var(--muted);text-decoration:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--tallow);outline-offset:2px}
select,input.nm{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:6px 8px;max-width:100%;min-height:44px}
input.nm{width:100%;font-family:"IM Fell English",Georgia,serif;font-size:22px;padding:4px 8px;min-height:40px}
input.nm:disabled{text-decoration:line-through;color:var(--muted);background:transparent;border-color:transparent}
h2{font-size:28px;margin:30px 0 4px}
h3{font-size:22px}
.lede{color:var(--muted);margin:0 0 16px;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.col{max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.hero.dead{opacity:.55}
.cls{margin:2px 0 10px;color:var(--muted);font-size:15px}
.tag{margin-left:8px;font-size:13px;padding:1px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.tag.won{color:var(--kin)}.tag.lost{color:var(--blood)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:3px;margin:6px 0 10px;background:var(--field)}
.st{text-align:center;padding:6px 2px 5px;border-left:1px solid var(--line)}
.st:first-child{border-left:0}
.st.base b,.strip .base b{color:var(--muted)}
.st .sl{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st b{display:block;font-size:28px;line-height:1.05}
.st .sm{display:block;font-size:12px;color:var(--blood);min-height:1.2em}
.st.cur{box-shadow:inset 0 -3px 0 var(--tallow)}
.stw{display:inline-flex;align-items:center;gap:6px}
.pips{display:inline-flex;gap:3px}
.pip{width:10px;height:10px;border-radius:2px;background:var(--line)}
.w0 .pip.f{background:var(--kin)}.w1 .pip.f{background:var(--tallow)}.w2 .pip.f{background:var(--blood)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:15px}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.note b{color:var(--ink);font-weight:700}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-align:left;display:flex;flex-direction:column;min-width:170px}
.chip small{color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--tallow);box-shadow:inset 0 0 0 1px var(--tallow)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin:0 0 12px}
.panel h3{margin-bottom:4px}
.panel p{margin:0 0 6px}
.summary{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tallow);padding:14px 16px;margin:10px 0}
.summary h3{font-size:26px}
.sec{border-top:1px dashed var(--line);padding:16px 0}
.sec h2,.sec h3{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.step{display:inline-flex;align-items:center;gap:12px}
.step button{width:44px;padding:0;font-size:22px;line-height:1}
.step output{min-width:1.6em;text-align:center;font-size:24px;font-family:"IM Fell English",Georgia,serif}
.kit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;max-width:620px;margin:10px 0}
.kit .k b{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:20px}
.kit .k small{display:block;color:var(--muted);font-size:14px}
.err{color:var(--blood);font-size:15px}
.bad{color:var(--blood)}
.beads{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bead{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--bead1),var(--bead2));box-shadow:0 1px 1px rgba(0,0,0,.35)}
.bead.gone{background:transparent;border:1.5px solid var(--line);box-shadow:none}
.bead.just{border-color:var(--blood);animation:pop .7s ease-out}
.beads.big .bead{width:24px;height:24px}
@keyframes pop{0%{transform:scale(1.5);opacity:.4}100%{transform:scale(1);opacity:1}}
ol.tasks{padding-left:1.3em;margin:8px 0}
ol.tasks li{padding:5px 0}
ol.tasks li.cur{font-weight:700}
ol.tasks li.todo{color:var(--muted)}
.squad{list-style:none;margin:0;padding:0}
.mem{padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem.dead .who{text-decoration:line-through;color:var(--muted)}
.who{font-family:"IM Fell English",Georgia,serif;font-size:21px}
.log{margin-bottom:6px}
.log:not(:empty){border-bottom:1px dashed var(--line);margin-bottom:14px}
.rd{padding:10px 0;border-top:1px solid var(--line)}
.rd:first-child{border-top:0}
.rd h3{font-size:19px}
.rd p{margin:3px 0}
.rd .hit{color:var(--kin)}.rd .wound,.rd .bad{color:var(--blood)}
.dice{font-size:14px;color:var(--muted)}
.big-result{font-family:"IM Fell English",Georgia,serif;font-size:30px;margin:2px 0 8px}
details{border-top:1px dashed var(--line);padding:14px 0}
summary{cursor:pointer;font-family:"IM Fell English",Georgia,serif;font-size:20px;min-height:36px}
details ul{margin:8px 0 0;padding-left:1.2em}
details li{margin-bottom:6px}
ul.hist{list-style:none;margin:8px 0 0;padding:0}
ul.hist li{padding:8px 0;border-top:1px solid var(--line)}
ul.hist li:first-child{border-top:0}
.dt{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.6fr);gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.dt:first-child{border-top:0}
.dt .pick{display:flex;flex-direction:column;gap:6px}
.affwrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 16px}
@media (max-width:640px){.dt{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.chip{min-width:0;flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tools{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:4px 0 12px}
.tools .sp{flex:1}
.cs{position:relative;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--stripe,var(--line));border-radius:4px;padding:6px 12px 8px 8px;margin:0 0 8px}
.cs[data-w="0"]{--stripe:var(--kin)}.cs[data-w="1"]{--stripe:var(--tallow)}.cs[data-w="2"]{--stripe:var(--blood)}.cs[data-w="3"]{--stripe:var(--muted)}
.cs.dead{opacity:.6}
.cs.dead .who{text-decoration:line-through;color:var(--muted)}
.cs-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.cs-h .who,.cs-h input.nm{flex:1 1 150px;min-width:0;font-size:21px}
.cs-h input.nm{width:auto}
.rk{color:var(--muted);font-size:15px}
.tg{width:44px;padding:0;font-size:22px;line-height:1;flex:none}
.tag.flag{color:var(--tallow)}
.tag.need{color:var(--ink)}
.strip{display:flex;flex-wrap:wrap;gap:0 16px;margin:0 0 0 54px;font-size:15px;color:var(--muted)}
.strip span{white-space:nowrap}
.strip b{font-family:"IM Fell English",Georgia,serif;font-weight:400;font-size:20px;color:var(--ink)}
.strip .cur,.tablewrap th.cur,.tablewrap td.cur{box-shadow:inset 0 -2px 0 var(--tallow)}
.strip i,.tablewrap i{font-style:normal;font-size:13px;color:var(--blood);margin-left:2px}
.cs-body{margin:6px 0 0 54px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;font-weight:500;color:var(--muted);background:var(--field)}
th.c,td.c{text-align:center}
td.num{font-family:"IM Fell English",Georgia,serif;font-size:19px}
tr:last-child td{border-bottom:0}
tr.dead td{opacity:.6}
tr.dead .lnk{text-decoration:line-through}
.dot{display:inline-block;width:8px;height:8px;background:var(--stripe,var(--line));margin-right:8px}
td .lnk{color:var(--ink);text-decoration:none;font-family:"IM Fell English",Georgia,serif;font-size:19px;min-height:36px}
.sh{background:none;border:0;padding:0 2px;min-height:36px;min-width:24px;font:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:2px;white-space:nowrap}
.sh:hover:not(:disabled){color:var(--ink)}
th[aria-sort="ascending"] .sh,th[aria-sort="descending"] .sh{color:var(--ink)}
.sh .ar{font-size:10px;margin-left:3px}
@media (max-width:640px){.strip,.cs-body{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand"><svg class="crest" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="none" stroke="var(--tallow)" stroke-width="2" stroke-linecap="round"><circle cx="32" cy="32" r="11.5"/><path d="M48 32L59 32M45.9 40L51 43M40 45.9L43 51M32 48L32 59M24 45.9L21 51M18.1 40L13 43M16 32L5 32M18.1 24L13 21M24 18.1L21 13M32 16L32 5M40 18.1L43 13M45.9 24L51 21"/><path d="M32 21V42M27.5 35H36.5"/></g></svg><h1>NoonChaser</h1></div>
      <p class="ask">Why do you ride against the dark?</p>
      <div class="camp"><label for="titleInput">Campaign</label><input class="title-input" id="titleInput" maxlength="40" value="The Sunless March"></div>
    </div>
    <div class="ledger" id="ledger"></div>
  </header>
  <nav id="tabs" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY='noonchaser-v2';
const DEFAULT_TITLE='The Sunless March';
const WOUNDS=['Hale','Bloodied','Maimed','Slain'];
const RANKS=['Squire','Yeoman','Man-at-Arms','Serjeant','Knight','Banneret','Castellan','Baron','Earl','Marshal','Champion'];
const MAX_RANK=RANKS.length-1;
const ROUND_LIMIT=5, MAX_ROSTER=8, STAT_CAP=18, WOUND_PEN=2;
const ORDER=['sta','mig','ins','tec','eti'];
const MSTATS=['sta','mig','tec'];
const STATN={sta:'Stature',mig:'Might',ins:'Insight',tec:'Technique',eti:'Etiquette'};
const MIGST={stu:'ins',pol:'eti',ac:'mig',cu:'tec',en:'sta'};

const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const d=n=>rnd(n)+1;
const pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
function deck(arr){let pool=[];return()=>{if(!pool.length)pool=arr.slice();return pool.splice(rnd(pool.length),1)[0];};}

/* ---------- content ---------- */
const CLR={
  hard:{n:'Stout Hauberk',t:'Wounded only on a d20 of 3 or less, instead of 4.'},
  medic:{n:'Herbwise',t:'After each encounter, rolls Technique. On a success, the most injured rider heals one step.'},
  iron:{n:'Iron Heart',t:'Cannot be wounded on Stature objectives.'},
  sharp:{n:'Second Blow',t:'Once per encounter, automatically rerolls a missed Might roll.'},
  manual:{n:'Old Lore',t:'Once per quest, automatically turns a missed Technique roll into a success.'},
  mule:{n:'Packhorse',t:'The company carries 2 more burden slots. Stacks.'},
  point:{n:'Outrider',t:'The map shows the next encounter\u2019s hook and how many perils wait there.'},
  stalker:{n:'Woodwarden',t:'Once per quest, a fall back skips the fallout roll and adds no grudge.'},
  insure:{n:'Abbey Patronage',t:'Unlocks the Abbey infirmary action at the hold for this rider.'}
};
const ITEMS={
  bandage:{n:'Bandages',t:'Heal one wound step, used from the map between encounters.'},
  flare:{n:'Torches',t:'Light one in an encounter: the whole company gets +1 on Might rolls until it ends.'},
  stim:{n:'Draughts',t:'When a round has misses and perils left, one draught rerolls the miss with the best odds. One per round.'}
};
const TRAITS={
  ambush:'Round one of every encounter: the company rolls at -2.',
  armoured:'The first hit of each encounter glances off and is wasted.',
  regen:'Once per encounter, if you clear two or more perils in a round, the enemy recovers up to two and the pool loses one peril.',
  fog:'Poor visibility: the company rolls at -2 in every round.',
  blood:'The wound chance rises by 1 each round of an encounter: a d20 of 4 or less in round 1, 5 or less in round 2, up to a maximum of 8.',
  hitrun:'Every encounter is timed at 3 rounds, including untimed objectives. Reaching round 3 counts as a timeout.',
  wired:'Each round the company clears 2 or more perils, one random living rider rolls Technique. On a miss, they take a wound.',
  pierce:'Stout Hauberk and Iron Heart do nothing this quest.',
  tough:'Once per encounter, the first time a round would clear the last peril, one peril survives.',
  learn:'The company rolls at -1 in the second encounter, -2 in the third, and -3 from the fourth on.',
  cutoff:'Falling back is disabled. Only a Woodwarden who has not used their ability can still fall back.',
  fester:'During the quest, Bandages and Herbwise can heal Maimed to Bloodied, but not Bloodied to Hale.',
  gas:'Torches don\u2019t work this quest.',
  drones:'At the end of each round with 2 or more perils left, one hurls a pitch-pot. It is removed and one random living rider takes a wound. It counts for no one\u2019s cleared total.',
  swarm:'A natural 1 clears only one peril, and the wounds-per-round limit is lifted.'
};
const OBJ=[
  {k:'fetch',st:'sta',n:'Fetch something',t:'Grab what you came for and get out.',timed:true,w:15},
  {k:'search',st:'tec',n:'Search the area',t:'Turn the place over for what is hidden here.',timed:true,w:15},
  {k:'scout',st:'tec',n:'Scout ahead',t:'Get eyes on the enemy and learn what they are up to.',timed:true,w:20},
  {k:'investigate',st:'tec',n:'Investigate',t:'Work out what happened here while the enemy is still around.',timed:false,w:10},
  {k:'eliminate',st:'mig',n:'Slay the enemy',t:'Break them before they break you.',timed:false,w:15},
  {k:'hunt',st:'mig',n:'Hunt them down',t:'They are on the move. Catch them before they reach cover.',timed:true,w:10},
  {k:'secure',st:'sta',n:'Secure the area',t:'Take the ground and hold it.',timed:false,w:15}
];
const ACTS={
  rest:['Rest','Heal one wound step.'],
  infirm:['Abbey infirmary','Heal two wound steps. Needs Abbey Patronage.'],
  train:['Train','Pick Stature, Might or Technique. Roll d20 under 20 minus the stat to raise it by 1.'],
  carouse:['Carouse','Pick Insight or Etiquette. Roll d20 under 20 minus the stat to raise it by 1.'],
  outfit:['Outfit','Roll d20 under Insight to advance a weapon step. Weapons are not in play yet.'],
  scout:['Scout ahead','Roll d20 under Technique. Success eases the peril pool on the next quest.'],
  forage:['Forage','Roll d20 under Stature. Success brings back a bandage, torch, or draught for the kit.'],
  pray:['Pray','Roll d20 under Insight. Success Blesses this rider: their next wound this campaign turn is shrugged off.'],
  advance:['Advancement','Roll d20 under Etiquette to earn the next rank.'],
  seek:['Seek rumors','Roll d20 under Insight. Success turns up word of a hidden location nearby.']
};
const ASTATS={train:['sta','mig','tec'],carouse:['ins','eti']};
const EVENTS=[
  {w:10,n:'A quiet week',fx(out){out.push('Nothing needs doing that a good night\u2019s sleep won\u2019t fix.');}},

function settleTypeRoll(adj){
  let r=clamp(d(100)+(adj||0),1,100),acc=0;
  for(let i=0;i<SETTLE_ORDER.length;i++){acc+=SETTLE_TYPES[SETTLE_ORDER[i]].w;if(r<=acc)return SETTLE_ORDER[i];}
  return 'hub';
}
function settlePopulation(){
  const r=d(100);
  if(r<=10)return{h:0,v:1,t:1};
  if(r<=30)return{h:1,v:1,t:1};
  if(r<=45)return{h:2,v:0,t:1};
  if(r<=60)return{h:0,v:2,t:1};
  if(r<=75)return{h:1,v:2,t:1};
  if(r<=90)return{h:2,v:1,t:1};
  return{h:2,v:2,t:1};
}

function toggleAdj(idA,idB){
  const a=S.map.provinces.find(x=>x.id===idA),b=S.map.provinces.find(x=>x.id===idB);
  if(!a||!b||a===b)return;
  if(!a.adj)a.adj=[];if(!b.adj)b.adj=[];
  if(a.adj.indexOf(idB)>=0){a.adj=a.adj.filter(x=>x!==idB);b.adj=b.adj.filter(x=>x!==idA);}
  else{a.adj.push(idB);b.adj.push(idA);}
}
function provDistance(fromId,toId){
  if(!fromId||!toId)return null;
  if(fromId===toId)return 0;
  const seen={};seen[fromId]=true;
  let frontier=[fromId],dist=0;
  while(frontier.length){
    dist++;
    const next=[];
    for(let i=0;i<frontier.length;i++){
      const p=S.map.provinces.find(x=>x.id===frontier[i]);
      if(!p)continue;
      const adj=p.adj||[];
      for(let j=0;j<adj.length;j++){
        const nid=adj[j];
        if(seen[nid])continue;
        if(nid===toId)return dist;
        seen[nid]=true;next.push(nid);
      }
    }
    frontier=next;
  }
  return null;
}
function removeProvince(id){
  S.map.provinces=S.map.provinces.filter(p=>p.id!==id);
  S.map.provinces.forEach(p=>{p.adj=(p.adj||[]).filter(x=>x!==id);});
  if(S.pos===id)S.pos=S.map.provinces.length?S.map.provinces[0].id:null;
  if(S.destProv===id)S.destProv='';
  S.targetLoc='';
}

function allocate(N,P,E){
  const C2=2*N,a=[];let i,v;
  for(i=0;i<E-1;i++){
    if(i===0)v=3;else if(i===1)v=N;else if(i===2)v=N+pick([-1,1,2]);else v=N+pick([-1,0,1]);
    a.push(clamp(v,1,C2));
  }
  let rem=P-sum(a),bi;const minF=Math.min(N,C2);
  while(rem<minF){
    bi=-1;a.forEach((x,j)=>{if(x>1&&(bi<0||x>a[bi]))bi=j;});
    if(bi<0)break;a[bi]--;rem++;
  }
  while(rem>C2){
    bi=-1;a.forEach((x,j)=>{if(x<C2&&(bi<0||x>=a[bi]))bi=j;});
    if(bi<0)break;a[bi]++;rem--;
  }
  return a;
}

  }else{

    out.goal=goals[kind[0]];

    let e1;

    else if(kind[0]==='meeting')e1=mkEnc({task:'Chance meeting',loc:roadD(),hook:hd(),obj:objFrom({eliminate:60,hunt:40}),planned:alloc[0]||3});
    else if(kind[0]==='plans')e1=mkEnc({task:'Enemy plans',loc:roadD(),hook:hd(),obj:objFrom(TRAV_W),planned:alloc[0]||3});
    else e1=mkEnc({task:'Unexplored location',loc:roadD(),hook:hd(),obj:objFrom(null),planned:alloc[0]||3});
    enc.push(e1);

}
function genMission(){

    trait:{k:tk,name:C.traits[tk][0],flavor:C.traits[tk][1],effect:TRAITS[tk]},

    enc:pl.enc,idx:0,bonusUsed:bonusUsed,easeUsed:easeUsed,manualUsed:{},stalkUsed:{},returning:pl.returning,tgt:pl.tgt||null,destProv:pl.destProv||null};

/* ---------- encounter engine ---------- */
function previewCommit(){
  const m=S.m,en=curEnc();
  if(isFinale())return Math.max(1,Math.min(m.pool,m.cap));
  return Math.max(1,Math.min(en.planned,Math.max(1,m.pool-1)));
}
function startEncounter(){
  const m=S.m,en=curEnc(),commit=previewCommit();
  m.pool=isFinale()?0:Math.max(0,m.pool-commit);
  en.commit=commit;en.tokens=commit;en.added=0;en.round=0;en.last=0;en.log=[];
  en.state='active';en.regenUsed=false;en.armourUsed=false;en.toughUsed=false;en.flare=false;en.sharp={};en.after=[];
  S.view='enc';
  render();
}
function tokensLeftAfter(rolls,en){
  let t=en.tokens,armour=S.m.trait.k==='armoured'&&!en.armourUsed;
  rolls.filter(x=>x.ok).sort((a,b)=>a.die-b.die).forEach(h=>{
    if(t<=0)return;
    if(armour){armour=false;return;}
    t-=Math.min(t,amtFor(h.die));
  });
  return t;
}
function playRound(){
  const m=S.m,en=curEnc();
  if(en.state!=='active')return;
  const tk=m.trait.k,L=live(),oo=objOf(en.obj),LN=en.kind==='traveler'?C.trav:C;
  if(!L.length)return;
  const r=++en.round,startTok=en.tokens,lines=[];
  const mod=modFor(en,oo.st,r);
  if(tk==='ambush'&&r===1)lines.push({c:'bad',t:'The enemy springs the ambush. The company rolls at -2 this round.'});
  if(tk==='learn'&&r===1&&m.idx>0)lines.push({c:'bad',t:'They have learned your moves. The company rolls at -'+Math.min(3,m.idx)+' in this encounter.'});
  if(tk==='blood'&&r>1)lines.push({c:'bad',t:'They are getting wilder. Wounds hit on a d20 of '+Math.min(8,3+r)+' or less this round.'});
  const rolls=L.map(mb=>{const tgt=targetFor(mb,oo.st,mod),x=roll20(tgt);return {mb:mb,die:x.die,tgt:tgt,ok:x.ok,note:''};});

  /* clearances fire automatically on a miss */
  rolls.forEach(x=>{
    if(x.ok)return;
    if(oo.st==='mig'&&hasClr(x.mb,'sharp')&&!en.sharp[x.mb.id]){
      en.sharp[x.mb.id]=true;
      const old=x.die,y=roll20(x.tgt);x.die=y.die;x.ok=y.ok;x.note=' (Second Blow, was '+old+')';
      lines.push({c:y.ok?'hit':'',t:esc(x.mb.name)+' takes a breath and swings again. It is a '+(y.ok?'hit.':'miss.')});
    }else if(oo.st==='tec'&&hasClr(x.mb,'manual')&&!m.manualUsed[x.mb.id]){
      m.manualUsed[x.mb.id]=true;x.ok=true;x.note=' (Old Lore)';
      lines.push({c:'hit',t:esc(x.mb.name)+' recalls an old tale and gets it right.'});
    }
  });

  /* biostim: one per round, on the best-odds miss, only if tokens would remain */
  if(m.items.stim>0){
    const misses=rolls.filter(x=>!x.ok);
    if(misses.length&&tokensLeftAfter(rolls,en)>0){
      const best=Math.max.apply(null,misses.map(x=>x.tgt));
      const x=pick(misses.filter(y=>y.tgt===best));
      m.items.stim--;
      const old=x.die,y=roll20(x.tgt);x.die=y.die;x.ok=y.ok;x.note+=' (draught, was '+old+')';
      lines.push({c:y.ok?'hit':'',t:esc(x.mb.name)+' drinks a draught and rerolls. It is a '+(y.ok?'hit.':'miss.')});
    }
  }

  /* apply hits */
  let cleared=0;
  rolls.filter(x=>x.ok).sort((a,b)=>a.die-b.die).forEach(h=>{
    if(en.tokens<=0)return;
    if(tk==='armoured'&&!en.armourUsed){
      en.armourUsed=true;
      lines.push({c:'',t:esc(h.mb.name)+"'s hit glances off the enemy armour and does nothing."});
      return;
    }
    let amt=Math.min(en.tokens,amtFor(h.die));
    if(tk==='tough'&&!en.toughUsed&&en.tokens-amt<=0){
      en.toughUsed=true;amt=en.tokens-1;
      lines.push({c:'bad',t:'The last one should be dead, but it drags itself back up. One peril survives.'});
    }
    if(amt>0){
      en.tokens-=amt;cleared+=amt;h.mb.cleared+=amt;h.mb.mc+=amt;h.mb.sc[oo.st]=(h.mb.sc[oo.st]||0)+amt;
      lines.push({c:'hit',t:fmt(pick(LN.hit),h.mb.name)+(amt>1?' A perfect blow takes two.':'')});
    }
  });
  if(tk==='regen'&&!en.regenUsed&&cleared>=2&&m.pool>0){
    const back=Math.min(2,cleared);
    m.pool--;en.tokens+=back;en.added+=back;en.regenUsed=true;
    lines.push({c:'bad',t:'The enemy rallies. '+back+' come back into the fight.'});
  }

  /* wounds: misses, worst roll first, never more than the hostiles standing at the start */
  let wounds=0;
  rolls.filter(x=>!x.ok).sort((a,b)=>b.die-a.die).forEach(f=>{
    const mb=f.mb;
    if(wounds<startTok||tk==='swarm'){
      if(oo.st==='sta'&&hasClr(mb,'iron')&&tk!=='pierce'){lines.push({c:'',t:esc(mb.name)+' shrugs off the blow.'});return;}
      if(checkBlessed(mb,lines,'')){return;}
      const need=woundNeed(mb,f.die,r);
      if(d(20)<=need){
        wounds++;
        mb.wound=Math.min(3,mb.wound+1);
        if(mb.wound===3)lines.push({c:'wound',t:esc(mb.name)+' falls and does not get up. (Slain)'});
        else lines.push({c:'wound',t:fmt(pick(LN.wound),mb.name)+' ('+WOUNDS[mb.wound]+')'});
        return;
      }
    }
    lines.push({c:'',t:fmt(pick(LN.miss),mb.name)});
  });

  if(tk==='wired'&&cleared>=2){
    const pool=live();
    if(pool.length){
      const mb=pick(pool),x=roll20(targetFor(mb,'tec',0));
      let extra='';
      if(!x.ok&&hasClr(mb,'manual')&&!m.manualUsed[mb.id]){m.manualUsed[mb.id]=true;x.ok=true;extra=' (Old Lore)';}
      const intro='A witch-knot on a fallen foe flares. Technique '+x.die+' vs '+x.tgt+extra+'.';
      if(x.ok)lines.push({c:'',t:intro+' '+esc(mb.name)+' dives clear.'});
      else autoWound(mb,oo,lines,intro);
    }
  }
  let drone=0;
  if(tk==='drones'&&en.tokens>=2){
    const pool=live();
    if(pool.length){en.tokens--;drone=1;autoWound(pick(pool),oo,lines,'A blazing pitch-pot smashes down among the company.');}
  }
  en.last=cleared+drone;
  const dice=STATN[oo.st]+(mod?' ('+(mod>0?'+':'')+mod+')':'')+': '+rolls.map(x=>esc(x.mb.name)+' '+x.die+' vs '+x.tgt+(x.ok?' hit':' miss')+x.note).join(' | ');
  en.log.push({r:r,cleared:cleared,left:en.tokens,lines:lines,dice:dice});
  if(!live().length)endEnc('wiped');
  else if(en.tokens<=0)endEnc('won');
  else if(roundLimit(en)&&r>=roundLimit(en))endEnc('timeout');
  render();
}
function addGrudge(faction,extra){
  const g=S.grudges.filter(x=>x.faction===faction)[0];
  if(g)g.level=Math.min(3,g.level+1+(extra||0));
  else S.grudges.push({id:uid(),faction:faction,level:Math.min(3,1+(extra||0))});
}
function medics(en){
  live().filter(x=>hasClr(x,'medic')).forEach(md=>{
    const hurt=live().filter(x=>x.wound>(S.m.trait.k==='fester'?1:0));
    if(!hurt.length)return;
    const worst=Math.max.apply(null,hurt.map(x=>x.wound));
    const tgt=pick(hurt.filter(x=>x.wound===worst));
    const x=roll20(targetFor(md,'tec',0));
    let extra='';
    if(!x.ok&&hasClr(md,'manual')&&!S.m.manualUsed[md.id]){S.m.manualUsed[md.id]=true;x.ok=true;extra=' Old Lore.';}
    if(x.ok){tgt.wound--;en.after.push(md.name+' patches up '+tgt.name+' ('+WOUNDS[tgt.wound]+'). Technique '+x.die+' vs '+x.tgt+'.'+extra);}
    else en.after.push(md.name+' cannot stop the bleeding on '+tgt.name+'. Technique '+x.die+' vs '+x.tgt+'.');
  });
}
function ambushEnc(from){
  const m=S.m,foe=m.foe||pick(HOSTILE);
  const hooks=C.hooks.filter(h=>h.f===foe);
  return mkEnc({kind:'ambush',task:'Ambush on the road',loc:from.loc,hook:pick(hooks.length?hooks:C.hooks),obj:'eliminate',planned:Math.max(1,from.tokens)});
}
function endEnc(kind){
  const m=S.m,en=curEnc(),fin=isFinale();
  en.state=kind;en.after=[];
  if(kind==='won'){
    if(fin&&m.returning){
      if(m.type==='threat'){en.note='Their hold on the district is broken.';}
      else{
        S.grudges=S.grudges.filter(x=>x.id!==m.returning.id);
        en.note='The old score is settled. That enemy will not come back.';
      }
    }
  }else if(kind==='retreat'||kind==='timeout'){
    if(!fin)m.pool+=en.tokens;
    if(en.kind==='traveler'){
      if(m.pool>0){
        m.enc.splice(m.idx+1,0,ambushEnc(en));
        en.note='It turns ugly as you break away. A hostile patrol has been shadowing the meeting, and it closes in.';
      }else en.note='You break away and the wayfarers let you go.';
    }else{
      const st=live().filter(x=>hasClr(x,'stalker')&&!m.stalkUsed[x.id])[0];
      if(st){
        m.stalkUsed[st.id]=true;
        en.note=st.name+' leads the company out by a path nobody is watching. No fallout, and no grudge.';
      }else{
        let extra=0;const f=d(6);
        if(f<=2){extra=1;en.note='They dig in and get stronger.';}
        else if(f===3){S.bonus+=1;en.note='Word spreads. The next quest starts with one extra Peril.';}
        else en.note='They lose you in the confusion. No further fallout.';
        if(!neutral(en.hook.f))addGrudge(en.hook.f,extra);
      }
      if(m.type==='travel'&&en.kind==='defense'){
        m.camped=true;
        en.note+=' The company makes camp short of the destination. The journey ends here.';
      }
    }
  }else{
    en.note='The quest ends here.';
    if(!neutral(en.hook.f))addGrudge(en.hook.f,0);
  }
  if(kind!=='wiped')medics(en);
}
function fallBack(){
  const en=curEnc();
  if(en.state!=='active'||!canFallBack())return;
  endEnc('retreat');
  render();
}
function afterEnc(){
  const en=curEnc();
  if(en.state==='wiped'||isFinale()||S.m.camped){computeDebrief();S.view='debrief';}
  else{S.m.idx++;S.view='board';}
  render();
}
function computeDebrief(){
  const m=S.m;
  const played=m.enc.filter(e=>e.state!=='pending'&&e.state!=='active');
  const won=played.filter(e=>e.state==='won').length,fails=played.length-won;
  const finaleWon=m.enc[m.enc.length-1].state==='won',wiped=played.some(e=>e.state==='wiped');
  m.result=wiped?'Company lost':finaleWon?(fails<=1?'Success':'Partial success'):'Failure';
  m.adv=[];
  if(m.result==='Success'){
    live().forEach(mb=>{
      if(!(mb.mc>0))return;
      let best=null,bv=-1;
      MSTATS.forEach(k=>{const v=(mb.sc&&mb.sc[k])||0;if(v>bv||(v===bv&&Math.random()<0.5)){bv=v;best=k;}});
      if(bv>0&&mb.st[best]<STAT_CAP)m.adv.push({id:mb.id,k:best});
    });
  }
  m.pay=[];
  if(m.type==='threat'&&(m.result==='Success'||m.result==='Partial success')){
    const n=m.result==='Success'?2:1,g=S.grudges.filter(x=>x.faction===m.foe)[0];
    if(g)m.pay.push({k:'grudge',f:g.faction,n:n,t:'The '+g.faction+' grudge drops from level '+g.level+' to '+(g.level-n>0?'level '+(g.level-n):'nothing')+'.'});
  }
  if(m.type==='contract'&&m.result==='Success'){
    const c=live().filter(x=>x.rank<MAX_RANK&&x.mc>0);
    if(c.length){
      const top=Math.max.apply(null,c.map(x=>x.mc)),mb=pick(c.filter(x=>x.mc===top));
      m.pay.push({k:'promo',id:mb.id,t:mb.name+' cleared the most perils and is raised to '+RANKS[mb.rank+1]+'.'});
    }
  }
  if(m.type==='patrol'&&m.patrolKind==='plans'&&m.result==='Success'){
    const g=topGrudge();
    if(g)m.pay.push({k:'grudge',f:g.faction,n:1,t:'The enemy plans are yours. The '+g.faction+' grudge drops from level '+g.level+' to '+(g.level-1>0?'level '+(g.level-1):'nothing')+'.'});
  }
}
function returnToBase(){
  const mm=S.m,played=mm.enc.filter(e=>e.state!=='pending'&&e.state!=='active');
  S.history.push({n:mm.n,title:mm.title||'',goal:mm.goal,result:mm.result||'Failure',won:played.filter(e=>e.state==='won').length,total:played.length,lost:mm.party.map(M).filter(x=>x&&x.wound>=3).map(x=>x.name)});
  (mm.adv||[]).forEach(a=>{const mb=M(a.id);if(mb&&mb.wound<3&&mb.st[a.k]<STAT_CAP)mb.st[a.k]++;});
  (mm.pay||[]).forEach(p=>{
    if(p.k==='promo'){const mb=M(p.id);if(mb&&mb.wound<3&&mb.rank<MAX_RANK)mb.rank++;}
    else if(p.k==='grudge'){const g=S.grudges.filter(x=>x.faction===p.f)[0];if(g){g.level-=p.n;if(g.level<=0)S.grudges=S.grudges.filter(x=>x!==g);}}
  });
  const reached=mm.result==='Success'||mm.result==='Partial success';
  if(mm.tgt){
    const tp=S.map.provinces.find(x=>x.id===mm.tgt.prov),tl=tp&&tp.locations.find(x=>x.id===mm.tgt.loc);
    if(tl&&reached)tl.cleared=true;
  }
  if(mm.type==='travel'){
    const sights=played.filter(e=>e.kind==='sight'&&e.state==='won').length;
    if(sights){
      const home=(mm.destProv&&reached)?S.map.provinces.find(x=>x.id===mm.destProv):curProvince();
      if(home)for(let i=0;i<sights;i++)home.locations.push(newLocation('unexp',null,false));
    }
    if(mm.destProv&&reached)S.pos=mm.destProv;
  }
  S.roster=S.roster.filter(mb=>{
    if(mb.wound>=3){S.fallen.push({name:mb.name,rank:mb.rank,week:S.week});return false;}
    return true;
  });
  S.roster.forEach(mb=>{mb.blessed=false;});
  S.done++;S.m=null;S.view='setup';S.phase='downtime';S.report=[];S.event=rollEvent();UI.tab='mission';
  UI.pick=UI.pick.filter(id=>M(id));
  render();
}

/* ---------- downtime ---------- */
function avail(mb){
  const a=['rest'],perk=settlePerk(),p=curProvince();
  if(hasClr(mb,'insure')||(perk&&perk.infirm))a.push('infirm');
  a.push('train','carouse','outfit','scout','forage','pray');
  if(p&&p.locations.some(l=>l.hidden))a.push('seek');
  if(mb.rank<MAX_RANK)a.push('advance');
  return a;
}
function statKeyFor(mb){
  const list=ASTATS[mb.act];
  if(!list)return '';
  return list.indexOf(mb.astat)>=0?mb.astat:list[0];
}
function stirGrudges(out){
  const provs=[],cp=curProvince();
  if(cp)provs.push(cp);
  const others=S.map.provinces.filter(p=>p.id!==S.pos);
  if(others.length)provs.push(pick(others));
  const risen=[];
  provs.forEach(p=>{
    (p.restless||[]).forEach(f=>{
      if(d(6)===1){
        const g=S.grudges.filter(x=>x.faction===f)[0];
        if(g)g.level=Math.min(3,g.level+1);
        else S.grudges.push({id:uid(),faction:f,level:1});
        risen.push(esc(f)+' in '+esc(p.name));
      }
    });
  });
  if(risen.length)out.push('Word spreads of rising trouble: '+risen.join(', ')+'.');
}
function resolveWeek(){
  const L=alive(),out=[];
  L.forEach(mb=>{
    if(avail(mb).indexOf(mb.act)<0)mb.act='rest';
    const nm=esc(mb.name);
    switch(mb.act){
      case 'rest':
        if(mb.wound>0){mb.wound--;out.push(nm+' rests and mends ('+WOUNDS[mb.wound]+').');}
        else out.push(nm+' rests. Nothing to mend.');
        break;
      case 'infirm':
        if(mb.wound>0){mb.wound=Math.max(0,mb.wound-2);out.push(nm+' is tended in the abbey infirmary ('+WOUNDS[mb.wound]+').');}
        else out.push(nm+' visits the abbey infirmary and is sent home. Nothing to treat.');
        break;
      case 'train':
      case 'carouse':{
        const k=statKeyFor(mb),verb=mb.act==='train'?'trains':'carouses';
        if(mb.st[k]>=STAT_CAP){out.push(nm+' '+verb+' but '+STATN[k]+' is already at '+STAT_CAP+'.');break;}
        const x=roll20(clamp(20-mb.st[k]+perkBonus(mb.act),1,19));
        if(x.ok){mb.st[k]++;out.push(nm+' '+verb+' ('+STATN[k]+', rolled '+x.die+' vs '+x.tgt+') and improves to '+mb.st[k]+'.');}
        else out.push(nm+' '+verb+' ('+STATN[k]+', rolled '+x.die+' vs '+x.tgt+'). No progress.');
        break;}
      case 'outfit':{
        const x=roll20(clamp(mb.st.ins+perkBonus('outfit'),1,19));
        if(x.ok){mb.weapon++;out.push(nm+' haggles with the armourer (rolled '+x.die+' vs '+x.tgt+'). Weapon step '+mb.weapon+'.');}
        else out.push(nm+' gets nowhere with the armourer (rolled '+x.die+' vs '+x.tgt+').');
        break;}
      case 'scout':{
        const x=roll20(clamp(mb.st.tec+perkBonus('scout'),1,19));
        if(x.ok){S.ease=Math.min(6,(S.ease||0)+2);out.push(nm+' scouts the roads ahead (rolled '+x.die+' vs '+x.tgt+'). The next quest starts easier.');}
        else out.push(nm+' scouts the roads ahead (rolled '+x.die+' vs '+x.tgt+') but turns up nothing useful.');
        break;}
      case 'forage':{
        const x=roll20(clamp(mb.st.sta+perkBonus('forage'),1,19));
        if(x.ok){const k=pick(['bandage','flare','stim']);S.kit[k]++;out.push(nm+' forages in the wilds (rolled '+x.die+' vs '+x.tgt+') and comes back with '+ITEMS[k].n.toLowerCase()+' for the kit.');}
        else out.push(nm+' forages in the wilds (rolled '+x.die+' vs '+x.tgt+') and comes back empty-handed.');
        break;}
      case 'pray':{
        const x=roll20(clamp(mb.st.ins+perkBonus('pray'),1,19));
        if(x.ok){mb.blessed=true;out.push(nm+' prays and is Blessed (rolled '+x.die+' vs '+x.tgt+'). Their next wound this campaign turn is shrugged off.');}
        else out.push(nm+' prays quietly (rolled '+x.die+' vs '+x.tgt+'). No sign it was heard.');
        break;}
      case 'seek':{
        const p=curProvince(),x=roll20(clamp(mb.st.ins,1,19));
        if(x.ok){const l=p&&revealHidden(p.id);out.push(l?nm+' turns up word of '+esc(l.name)+' nearby (rolled '+x.die+' vs '+x.tgt+').':nm+' asks around (rolled '+x.die+' vs '+x.tgt+') but finds nothing new.');}
        else out.push(nm+' asks around the district (rolled '+x.die+' vs '+x.tgt+') and hears nothing worth chasing.');
        break;}
      case 'advance':{
        const x=roll20(clamp(mb.st.eti,1,19));
        if(x.ok&&mb.rank<MAX_RANK){
          mb.rank++;
          out.push(nm+' is raised to '+RANKS[mb.rank]+' (rolled '+x.die+' vs '+x.tgt+')'+(mb.rank%2===0?' and earns a boon.':'.'));
        }else out.push(nm+' is passed over for advancement (rolled '+x.die+' vs '+x.tgt+').');
        break;}
    }
  });
  stirGrudges(out);
  S.report=out;S.week++;S.phase='ready';S.contracts.offers=makeOffers();S.event=null;
  alive().forEach(mb=>{mb.act='rest';mb.astat='';});
  UI.dErr='';
  render();
}

function sortVal(mb,k,o){
  switch(k){
    case 'name':return mb.name.toLowerCase();

    case 'need':return needOf(mb,o);

    default:return mb.st[k];
  }
}
function sortedList(list,o,key,dir){

    const c=(typeof a.v==='string')?a.v.localeCompare(b.v):a.v-b.v;

function vEnc(){

  ).join('');
  let result='';

    const titles={won:'Objective achieved',retreat:'You fell back',timeout:'Out of time',wiped:'The company is down'};

  return (active?'<div class="row" style="margin-top:0"><button class="main" data-a="round">Play round</button>'+flareBtn+'<button data-a="back"'+(canFallBack()?'':' disabled')+'>Fall back</button></div>':'')

    +'<div class="panel"><h3>'+esc(o.n)+'</h3><p>'+esc(o.t)+'</p><p class="muted small">'+timer+'. Everyone rolls '+STATN[o.st]+'.'+(en.flare&&o.st==='mig'?' The torch adds +1.':'')+'</p><p class="muted small">Trait: '+esc(m.trait.name)+'. '+esc(m.trait.effect)+'</p>'+(en.kind==='traveler'?'<p class="muted small">Wayfarer encounter: if you fall back or run out of time, a hostile patrol ambushes you.</p>':'')+(en.kind==='defense'?'<p class="muted small">Defensive battle: falling back or running out of time ends the journey here.</p>':'')+(en.kind==='ambush'?'<p class="muted small">You were followed. This is a straight fight.</p>':'')+'<p class="muted small">Draughts '+it.stim+' (one per round, automatic). Torches '+it.flare+'.</p></div>'
    +'<div class="sec"><h3>Peril: '+en.tokens+' left of '+(en.commit+en.added)+'</h3>'+beads(en.tokens,en.commit+en.added,en.last,true)+'</div>'
    +'<div class="sec"><h3>Company</h3>'+squadPanel(deployed(),{hi:o.st,en:en})+'</div></div>';

      +(list?'<select data-stat-for="'+mb.id+'" aria-label="Stat for '+esc(mb.name)+'">'+list.map(k=>'<option value="'+k+'"'+(k===statKeyFor(mb)?' selected':'')+'>'+STATN[k]+' ('+mb.st[k]+')</option>').join('')+'</select>':'')+'</div>'

    +(S.report.length?'<div class="summary"><h3>Last week</h3>'+S.report.map(t=>'<p style="margin:4px 0">'+t+'</p>').join('')+'</div>':'')+'</div>';

/* ---------- render + events ---------- */
let lastKey=null;
function render(){
  if(['brief','board','enc','debrief'].indexOf(S.view)>=0&&!S.m)S.view='setup';
  Object.keys(S.ui.open).forEach(id=>{if(!M(id))delete S.ui.open[id];});
  if(UI.rmProv&&!S.map.provinces.some(p=>p.id===UI.rmProv))UI.rmProv=null;
  const A=alive();
  $('#ledger').innerHTML='<div>Week<b>'+S.week+'</b></div><div>Quests<b>'+S.done+'</b></div><div>Company<b>'+A.length+'</b></div>';
  const tabs=[['squad','Company'],['map','Realm'],['mission',S.m?'Quest (underway)':(S.phase==='downtime'?'The Hold (due)':'Quest')]];
  $('#tabs').innerHTML=tabs.map(t=>'<button data-a="tab" data-t="'+t[0]+'"'+(UI.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>').join('');
  $('#view').innerHTML=UI.tab==='squad'?vSquad():UI.tab==='map'?vMap():vMission();
  save();
  const key=UI.tab+':'+(UI.tab==='mission'?S.view+':'+S.phase:'');
  if(key!==lastKey)window.scrollTo(0,0);
  lastKey=key;
  if(UI.jump){const el=document.getElementById&&document.getElementById('card-'+UI.jump);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});UI.jump=null;}
  if(UI.focus){const el=document.querySelector(UI.focus);if(el&&el.focus)el.focus();UI.focus=null;}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='tab'){UI.tab=b.dataset.t;UI.confirmReset=false;UI.err='';return render();}
  if(a==='survey'){if(!S.map.provinces.length)surveyRegion();else surveyOne();return render();}
  if(a==='rmprov1'){UI.rmProv=b.dataset.prov;return render();}
  if(a==='rmprov0'){UI.rmProv=null;return render();}
  if(a==='rmprov2'){removeProvince(b.dataset.prov);UI.rmProv=null;return render();}
  if(a==='setpos'){if(S.map.provinces.some(p=>p.id===b.dataset.prov))S.pos=b.dataset.prov;return render();}
  if(a==='rmloc'){removeLocation(b.dataset.prov,b.dataset.loc);return render();}
  if(a==='addloc'){
    const pid=b.dataset.prov;
    const ksel=document.querySelector('[data-add-kind="'+pid+'"]'),hsel=document.querySelector('[data-add-hidden="'+pid+'"]');
    addLocation(pid,ksel?ksel.value:'unexp',hsel?hsel.checked:false);
    return render();
  }
  if(a==='tgtloc'){S.targetLoc=b.dataset.id||'';return render();}
  if(a==='destprov'){
    S.destProv=b.dataset.id||'';
    if(S.destProv){const dist=provDistance(S.pos,S.destProv);if(dist!=null)S.legs=clamp(dist+2,3,8);}
    return render();
  }
  if(a==='adj'){toggleAdj(b.dataset.a1,b.dataset.a2);return render();}
  if(a==='pick'){
    const id=b.dataset.id,i=UI.pick.indexOf(id);
    if(i>=0)UI.pick.splice(i,1);else if(UI.pick.length<MAX_ROSTER)UI.pick.push(id);
    UI.err='';return render();
  }
  if(a==='kit'){
    const k=b.dataset.k,dl=parseInt(b.dataset.d,10);
    if(dl>0&&kitN()>=capOf(UI.pick))return;
    S.kit[k]=clamp(S.kit[k]+dl,0,20);UI.err='';return render();
  }
  if(a==='enc'){S.encN+=parseInt(b.dataset.d,10);return render();}
  if(a==='gen')return genMission();
  if(a==='discard'){S.bonus=S.m.bonusUsed;S.ease=S.m.easeUsed||0;if(S.m.contract)S.contracts.accepted=S.m.contract;S.m=null;S.view='setup';return render();}
  if(a==='mtype'){if(MTYPES[b.dataset.t]){S.mtype=b.dataset.t;UI.err='';}return render();}
  if(a==='kind'){if(KINDS[b.dataset.k]){S.kind=b.dataset.k;S.targetLoc='';}return render();}
  if(a==='threat'){if(HOSTILE.indexOf(b.dataset.f)>=0)S.threat=b.dataset.f;return render();}
  if(a==='legs'){S.legs=clamp(S.legs+parseInt(b.dataset.d,10),3,8);return render();}
  if(a==='accept'){
    const o=S.contracts.offers.filter(x=>x.id===b.dataset.id)[0];
    if(o&&!S.contracts.accepted){S.contracts.accepted=o;S.contracts.offers=S.contracts.offers.filter(x=>x!==o);UI.err='';}
    return render();
  }
  if(a==='drop'){S.contracts.accepted=null;return render();}
  if(a==='begin'){S.view='board';return render();}
  if(a==='move')return startEncounter();
  if(a==='round')return playRound();
  if(a==='back')return fallBack();
  if(a==='flare'){
    const en=S.m&&curEnc();
    if(en&&en.state==='active'&&!en.flare&&S.m.items.flare>0&&S.m.trait.k!=='gas'){S.m.items.flare--;en.flare=true;}
    return render();
  }
  if(a==='band'){
    const mb=M(b.dataset.id);
    if(S.m&&mb&&mb.wound>0&&mb.wound<3&&S.m.items.bandage>0&&!(S.m.trait.k==='fester'&&mb.wound<2)){S.m.items.bandage--;mb.wound--;}
    return render();
  }
  if(a==='cont')return afterEnc();
  if(a==='next')return returnToBase();
  if(a==='recruit'){
    if(!S.m&&S.roster.length<MAX_ROSTER){
      const mb=newMember(S.roster),perk=settlePerk();
      if(perk&&perk.recruit){const k=pick(ORDER);mb.st[k]=clamp(mb.st[k]+perk.recruit,1,STAT_CAP);}
      S.roster.push(mb);if(UI.pick.length<MAX_ROSTER)UI.pick.push(mb.id);
    }
    return render();
  }
  if(a==='rm'){
    if(!S.m&&alive().length>2){S.roster=S.roster.filter(x=>x.id!==b.dataset.id);UI.pick=UI.pick.filter(id=>id!==b.dataset.id);}
    return render();
  }
  if(a==='clr'){
    const mb=M(b.dataset.id),sel=document.querySelector('[data-clr-for="'+b.dataset.id+'"]');
    if(mb&&sel&&CLR[sel.value]&&mb.cl.indexOf(sel.value)<0&&Math.floor(mb.rank/2)>mb.cl.length)mb.cl.push(sel.value);
    return render();
  }
  if(a==='tog'){
    const id=b.dataset.id;
    if(S.ui.open[id])delete S.ui.open[id];else S.ui.open[id]=true;
    UI.focus='[data-a="tog"][data-id="'+id+'"]';return render();
  }
  if(a==='openall'||a==='closeall'){
    (UI.tab==='mission'?deployed():S.roster).forEach(x=>{if(a==='openall')S.ui.open[x.id]=true;else delete S.ui.open[x.id];});
    return render();
  }
  if(a==='mode'){S.ui.mode=S.ui.mode==='table'?'cards':'table';UI.focus='#modeBtn';return render();}
  if(a==='sort'){
    const k=b.dataset.k,u=S.ui.sort,def=SORT_DEF[k];
    if(def===undefined)return;
    if(u.key!==k)S.ui.sort={key:k,dir:def};
    else if(u.dir===def)S.ui.sort={key:k,dir:-def};
    else S.ui.sort={key:'',dir:1};
    UI.focus='[data-a="sort"][data-k="'+k+'"]';return render();
  }
  if(a==='jump'){S.ui.mode='cards';S.ui.open[b.dataset.id]=true;UI.jump=b.dataset.id;return render();}
  if(a==='resolve')return resolveWeek();
  if(a==='reset1'){UI.confirmReset=true;return render();}
  if(a==='reset0'){UI.confirmReset=false;return render();}
  if(a==='reset2'){S=fresh();UI.confirmReset=false;UI.err='';initUI();$('#titleInput').value=S.title;return render();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('nm')){
    const mb=M(t.dataset.id);
    if(mb){mb.name=t.value.slice(0,24);save();}
  }else if(t.id==='titleInput'){
    S.title=t.value.slice(0,40);save();
  }else if(t.id==='realmInput'){
    S.map.name=t.value.slice(0,40);save();
  }else if(t.classList&&t.classList.contains('pnm')){
    const p=S.map.provinces.find(x=>x.id===t.dataset.prov);
    if(p){p.name=t.value.slice(0,30);save();}
  }else if(t.classList&&t.classList.contains('snm')){
    const p=S.map.provinces.find(x=>x.id===t.dataset.prov),set=p&&p.locations.find(l=>l.kind==='settle');
    if(set){set.name=t.value.slice(0,24);save();}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.actFor){const mb=M(t.dataset.actFor);if(mb){mb.act=t.value;mb.astat='';}return render();}
  if(t.dataset.statFor){const mb=M(t.dataset.statFor);if(mb)mb.astat=t.value;return render();}
});
initUI();
$('#titleInput').value=S.title;
render();
})();
</script>
</body>
</html>
