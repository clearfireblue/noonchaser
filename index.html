*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3,.fell{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 64px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:3px double var(--line);padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.crest{flex:none;width:52px;height:52px}
h1{font-family:var(--sc);font-size:clamp(32px,6vw,50px);letter-spacing:.03em}
.band{margin:4px 0 0;color:var(--muted);font-family:var(--display);font-style:italic;font-size:19px}
.ledger{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px;color:var(--muted)}
.ledger b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
header .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
header .bar .note{font-size:14px;color:var(--muted)}
.savesp{margin:0 0 18px;background:var(--field)}
nav{display:flex;gap:4px;margin:12px 0 18px;flex-wrap:wrap;align-items:center}
nav .sp{flex:1}
nav button.tab{border:0;background:none;padding:8px 12px;font-size:17px;color:var(--muted);border-bottom:2px solid transparent;border-radius:0}
nav button.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tallow)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 14px;cursor:pointer;min-height:44px}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.warn{border-color:var(--blood);color:var(--blood)}
button.lnk{background:none;border:0;padding:4px 2px;min-height:36px;color:var(--tallow);text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tallow);outline-offset:2px}
input.nm,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:3px;padding:6px 8px;min-height:44px;max-width:100%}
input.nm{font-family:var(--display);font-size:20px}
h2{font-size:26px;margin:0 0 4px}
h3{font-size:20px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:14px}
.lede{color:var(--muted);margin:0 0 14px;max-width:65ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* two panes */
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.list{border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden}
.sorts{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--field);font-size:13px;color:var(--muted)}
.sorts button{min-height:32px;padding:2px 8px;font-size:13px;background:none;border:1px solid transparent;color:var(--muted)}
.sorts button[aria-pressed="true"]{border-color:var(--tallow);color:var(--ink)}
.sorts .fallbtn{margin-left:auto}
.rrow{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;border-radius:0;padding:8px 10px}
.rrow:last-child{border-bottom:0}
.grip{grid-row:1/3;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin:-8px 0 -8px -10px;padding-left:6px}
.rrow.dragging{position:relative;z-index:3;background:var(--field);box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:.95}
.rlist.drag .rrow:not(.dragging){transition:transform .15s ease}
.rrow.dragging{will-change:transform}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.rrow[aria-current="true"]{background:var(--field);border-left-color:var(--tallow)}
.rrow .nmw{display:block;font-family:var(--display);font-size:19px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .tier{display:block;font-size:13px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(5,26px);gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.mini span{font-size:15px}.mini small{display:block;font-size:10px;color:var(--muted);line-height:1}
.wbar{grid-column:3/5;display:flex;gap:2px;height:7px}
.wbar i{flex:1;max-width:18px;background:var(--line);border-radius:1px}
.wbar i.f{background:var(--blood)}
.wbar i.a{background:var(--steel)}
.bust{width:44px;height:44px;border-radius:3px;background:var(--field);border:1px solid var(--line);display:block;image-rendering:pixelated}
.bust.big{width:96px;height:96px}
.bustcol{display:flex;flex-direction:column;align-items:center;gap:4px}
p.lore{margin:6px 0;font-style:italic}
ul.hist li{padding:6px 0}

/* dossier */
.dossier{position:sticky;top:12px}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.dhead input.nm{width:100%}
.sec{border-top:1px dashed var(--line);padding:12px 0 4px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:3px;background:var(--field);margin:4px 0 8px}
.st{text-align:center;padding:6px 2px;border-left:1px solid var(--line)}
.st:first-child{border-left:0}
.st small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.queue{list-style:none;margin:6px 0;padding:0}
.queue li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.queue li:last-child{border-bottom:0}
.trainbtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.trainbtns button{padding:4px 2px;font-size:13px;line-height:1.2}
.trainbtns b{display:block;font-family:var(--display);font-weight:400;font-size:16px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--kin)}.pill.bad{color:var(--blood)}.pill.cap{color:var(--tallow)}
.back{display:none}
.empty{padding:20px;color:var(--muted)}
/* saves & new */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.slot h3{margin-bottom:2px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:12px 0}
.cand{display:flex;flex-direction:column;gap:6px}
.log{list-style:none;margin:0;padding:0;max-width:70ch}
.log li{padding:10px 0;border-bottom:1px solid var(--line)}
.log li b{font-family:var(--display);font-weight:400;font-size:18px}
.season{display:flex;gap:4px;margin-top:4px}
.season span{font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.season span.on{border-color:var(--tallow);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:15px;max-width:90vw;z-index:9}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:8}
.dlg .panel{max-width:440px;width:100%}
/* realm */

<script>
(function(){
'use strict';
/* ---------- rules ---------- */
const STATS=['sta','mig','ins','tec','eti'];
const STATN={sta:'Stature',mig:'Might',ins:'Insight',tec:'Technique',eti:'Etiquette'};
const STATA={sta:'Sta',mig:'Mig',ins:'Ins',tec:'Tec',eti:'Eti'};
const TIERS=['Recruit','Seasoned','Veteran','Champion'];
const STAT_CAP=18, SLOTS=3, START_GOLD=30, WEEKS_PER_SEASON=3;
const SEASONS=['Spring','Summer','Autumn','Winter'];
const LOCAL='noonchaser2-saves', PREF='noonchaser2-prefs';

const rnd=n=>Math.floor(Math.random()*n), d=n=>rnd(n)+1, pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

/* ---------- names ---------- */
const GIVEN_M=["Cadoc", "Brannoc", "Aldous", "Bors", "Idris", "Peredur", "Rourke", "Sutton", "Gethin", "Wat", "Hollis", "Vaughan", "Madoc", "Arlo", "Emrys", "Lowen", "Odo", "Merrick", "Hew", "Garrick", "Tobin", "Corwin", "Ralf", "Owain", "Piran", "Osric", "Hamo", "Drogo", "Jory", "Fulk"];
const GIVEN_F=["Elowen", "Gwenllian", "Ysolt", "Nest", "Morwenna", "Rhosyn", "Sabel", "Tamsin", "Alys", "Enid", "Isolde", "Maud", "Agnes", "Brigid", "Edda", "Wenna", "Lettice", "Clemence", "Avice", "Mabyn", "Elspeth", "Gwen", "Joan", "Matilda", "Rowena", "Sibyl", "Aveline", "Hild", "Branwen", "Ide"];
const GIVEN=GIVEN_M.concat(GIVEN_F);
const givenOf=sx=>sx==="f"?GIVEN_F:sx==="m"?GIVEN_M:GIVEN;
function sexOfName(n){const g=String(n||"").split(" ")[0];return GIVEN_F.includes(g)?"f":GIVEN_M.includes(g)?"m":null;}

const SUR_A=['Harl','Voss','Ash','Crane','Hall','Madd','Brand','Lund','Teag','Dan','Finch','Bast','Ford','Pru','Thorn','Grey','Black','Fen','Marr','Cinder','Stone','Rook','Tall','Wick','Hollow','Dun','Sable','Bram'];
const SUR_B=['','ow','ock','er','ley','well','wright','more','by','ton','ard','ett','ick','ing'];
const EPITHET=['the Lame','the Quiet','Halfhand','the Younger','Two-Rivers','the Tall','Ironsides','the Pale','Greycloak','the Lucky','Longshanks','the Smith','Crowsbane','the Fair','Oathless','the Elder'];
const PLACE_A=['Camlann','Grey','Hollow','Thistle','Farrow','Sable','Cinder','Marrow','Ashen','Raven','Dun','Stone','Thorn','Ash'];
const PLACE_B=['ford','cross','wick','hill','gate','wood','marsh','down','fen','barrow','reach','mere','holt'];
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
function genName(taken,sx){
  for(let i=0;i<40;i++){
    const g=pick(givenOf(sx)), r=d(10); let n;
    if(r<=6) n=g+' '+pick(SUR_A)+pick(SUR_B);
    else if(r<=8) n=g+' '+pick(EPITHET);
    else n=g+' of '+pick(PLACE_A)+pick(PLACE_B);
    if(!taken.has(n)) return n;
  }
  return pick(givenOf(sx))+' '+uid().slice(0,3);
}

/* ---------- riders ---------- */
const LOOKS=["FKin46", "FKin47", "FKin48", "FKin49", "FKin50", "FKin51", "FKin52", "FKin53", "FKin54", "FKin55", "FKin56", "FKin57", "FKin58", "FKin59", "FKin60", "FKinNKnight", "FKinNKnight2", "FKinNNoble", "FKinNRanger", "FKinNRanger2", "FKinNoble", "FKinNoble2", "Fknight", "Fknight2", "Fmercenary", "Fmercenary1", "Fmercenary2", "Fmercenary3", "Franger", "Franger1", "Franger2", "Franger3", "Franger4", "MKin17", "MKin18", "MKin19", "MKin20", "MKin21", "MKin22", "MKin23", "MKin24", "MKin25", "MKin26", "MKin27", "MKin28", "MKin29", "MKin30", "MKin31", "MKinBard", "MKinKnight", "MKinNKnight", "MKinNKnight2", "MKinNKnight3", "MKinNKnight4", "MKinNNoble", "MKinNNoble2", "MKinNNoble4", "MKinNRanger", "MKinNRanger2", "MKinNRogue", "MKinNRogue2", "Mknight", "Mknight2", "Mmercenary", "Mmercenary2", "Mmercenary3", "Mmercenary4", "Mranger", "Mranger2", "Mranger3", "Mranger4"];
const looksFor=sx=>LOOKS.filter(k=>k[0]===(sx==="f"?"F":"M"));
function pickLook(sx,not){const l=looksFor(sx).filter(k=>k!==not);return pick(l.length?l:looksFor(sx));}
const rollSex=()=>d(2)===1?"m":"f";
const roll3d6=()=>d(6)+d(6)+d(6);
function newRider(tier,taken){
  const st={}; STATS.forEach(k=>st[k]=roll3d6());
  const sx=rollSex();
  return {id:uid(),rank:'trp',boss:null,sex:sx,look:pickLook(sx),hist:[],name:genName(taken||new Set(),sx),tier:tier||0,st,wounds:0,weapon:0,armor:0,relics:[],spec:null,boons:[],train:[],scars:[],status:'ready',joined:1,seed:rnd(1e9),age:rollAge(tier),bonds:{},rode:{},partner:null,hearth:null,parents:[]};
}
const capacity=r=>Math.floor(r.st.sta/2)+r.armor+(r.relics.includes('R6')?1+heirG(r,'relic'):0)+(trade(r)==='baker'?1:0);
const total=r=>STATS.reduce((a,k)=>a+r.st[k],0);
/* projected stat after its queued +1s */
const projected=(r,k)=>r.st[k]+r.train.filter(x=>x===k).length;
const trainCost=(r,k)=>projected(r,k);

/* Survival at the wound limit (row 3): d20 roll-under Stature + relic bonus - overkill; nat 1 lives, nat 20 dies. Used from Phase 2 on. */
function takeWounds(r,n,relicBonus){
  r.wounds+=n; const capN=capacity(r);
  if(r.wounds<capN) return {fell:false};
  const over=r.wounds-capN, tgt=r.st.sta+(relicBonus||0)-over, die=d(20);
  const lived=die===1||(die!==20&&die<=tgt);
  r.wounds=capN;
  if(lived){r.scars.push('Survived a fall in week '+S.week);return {fell:true,lived:true,die,tgt};}
  return {fell:true,lived:false,die,tgt};
}
function slay(r,cause,ls){
  S.riders=S.riders.filter(x=>x.id!==r.id);
  r.status='fallen'; r.fellWeek=S.week; r.cause=cause||'';
  S.fallen.unshift(r);
  if(S.captain===r.id) succeed();
  onFall(r,ls);
}
/* ---------- chain of command: Captain, Lieutenants, Sergeants, Troopers ----------
   Each rider has r.rank ('cap','lt','sgt','trp') and r.boss (the id they report to). The player promotes, demotes
   and reassigns; when a leader leaves, their best subordinate steps into the place and keeps the rest. */
const RANKS=['cap','lt','sgt','trp'], RANK_N={cap:'Captain',lt:'Lieutenant',sgt:'Sergeant',trp:'Trooper'};
const rankUp=k=>RANKS[RANKS.indexOf(k)-1], rankDown=k=>RANKS[RANKS.indexOf(k)+1];
const orgMembers=()=>S.riders;
const subsOf=id=>orgMembers().filter(r=>r.boss===id&&r.id!==id);
const seniority=(a,b)=>(b.tier-a.tier)||((b.hist||[]).length-(a.hist||[]).length)||(a.joined-b.joined)||(b.age-a.age);
function leastLoaded(rank,not){
  let k=rank;
  while(k){const L=orgMembers().filter(r=>r.rank===k&&r.id!==not);
    if(L.length) return L.sort((a,b)=>subsOf(a.id).length-subsOf(b.id).length||seniority(a,b))[0].id;
    k=rankUp(k);}
  return null;
}
/* the best of a leaderless group steps into the empty place at `rank` under `bossId`, keeps the rest, and the chain mends below them */
function stepUp(group,rank,bossId){
  group=group.filter(r=>orgMembers().includes(r)); if(!group.length) return;
  const best=group.slice().sort(seniority)[0], below=subsOf(best.id), oldRank=best.rank;
  best.rank=rank; best.boss=rank==='cap'?null:bossId;
  if(rank==='cap') S.captain=best.id;
  group.forEach(r=>{if(r!==best)r.boss=best.id;});
  if(below.length&&oldRank!==rank) stepUp(below,oldRank,best.id);
}
function orgFix(){
  if(!S||!S.riders) return;
  const M=orgMembers(), ids=new Set(M.map(r=>r.id));
  if(!M.length){return;}
  M.forEach(r=>{if(!RANKS.includes(r.rank)) r.rank='trp';});
  /* captain gone: the senior Lieutenant steps up (or the best of whoever is highest) */
  if(!S.captain||!ids.has(S.captain)){
    const old=S.captain, under=M.filter(r=>r.boss===old&&r.boss);
    let group=under.length?under:[];
    if(!group.length){for(const k of ['lt','sgt','trp']){group=M.filter(r=>r.rank===k);if(group.length)break;}}
    const best=group.slice().sort(seniority)[0], below=subsOf(best.id), oldRank=best.rank;
    S.captain=best.id; best.rank='cap'; best.boss=null;
    group.forEach(r=>{if(r!==best&&r.rank==='lt')r.boss=best.id;});
    if(below.length&&oldRank!=='cap') stepUp(below,oldRank,best.id);
  }
  M.forEach(r=>{if(r.id===S.captain){r.rank='cap';r.boss=null;}else if(r.rank==='cap'){r.rank='lt';r.boss=S.captain;}});
  /* leaders who left: their people close ranks behind the best of them */
  for(let pass=0;pass<6;pass++){
    const orphans={};
    M.forEach(r=>{if(r.rank!=='cap'&&r.boss&&!ids.has(r.boss))(orphans[r.boss]=orphans[r.boss]||[]).push(r);});
    const keys=Object.keys(orphans); if(!keys.length) break;
    keys.forEach(bid=>{const gone=person(bid), grp=orphans[bid];
      if(gone&&RANKS.includes(gone.rank)&&gone.rank!=='cap'){
        const up=gone.boss&&ids.has(gone.boss)?gone.boss:leastLoaded(rankUp(gone.rank));
        stepUp(grp.filter(r=>r.rank===rankDown(gone.rank)),gone.rank,up);
        grp.filter(r=>r.boss===bid).forEach(r=>{r.boss=null;});
      } else grp.forEach(r=>{r.boss=null;});
    });
  }
  /* everyone reports to someone one rank up, or the nearest rank above that has anyone */
  M.forEach(r=>{if(r.rank==='cap')return;
    const b=r.boss&&M.find(x=>x.id===r.boss), want=rankUp(r.rank);
    const okRank=b&&RANKS.indexOf(b.rank)<RANKS.indexOf(r.rank);
    const better=b&&b.rank!==want&&M.some(x=>x.rank===want);
    if(!okRank||better) r.boss=leastLoaded(want,r.id)||S.captain;});
}
function succeed(){orgFix();}
function promote(r){
  if(r.rank==='lt'){makeCaptain(r);return;}
  if(r.rank==='trp'){r.rank='sgt';r.boss=leastLoaded('lt',r.id)||S.captain;}
  else if(r.rank==='sgt'){const sub=subsOf(r.id);stepUp(sub,'sgt',r.boss);r.rank='lt';r.boss=S.captain;}
  orgFix();
}
function demote(r){
  if(r.rank==='lt'){const sub=subsOf(r.id);stepUp(sub,'lt',S.captain);r.rank='sgt';r.boss=leastLoaded('lt',r.id)||S.captain;}
  else if(r.rank==='sgt'){const sub=subsOf(r.id);stepUp(sub,'sgt',r.boss);r.rank='trp';r.boss=leastLoaded('sgt',r.id)||S.captain;}
  orgFix();
}
function makeCaptain(r){
  const old=S.riders.find(x=>x.id===S.captain); if(!r||old===r) return;
  const sub=subsOf(r.id); if(r.rank!=='cap') stepUp(sub,r.rank,r.boss);
  S.captain=r.id; r.rank='cap'; r.boss=null;
  if(old){old.rank='lt';old.boss=r.id;}
  S.riders.forEach(x=>{if(x.rank==='lt')x.boss=r.id;});
  orgFix();
}
/* drag and drop: onto a person = report to them (one rank below them); onto a row = take that rank */
function moveRank(r,rank,bossId){
  if(rank==='cap'){makeCaptain(r);return;}
  if(rank!==r.rank){const sub=subsOf(r.id); if(sub.length) stepUp(sub,r.rank,r.boss); r.rank=rank;}
  const b=bossId&&S.riders.find(x=>x.id===bossId);
  r.boss=b&&b.id!==r.id&&RANKS.indexOf(b.rank)<RANKS.indexOf(r.rank)?b.id:(leastLoaded(rankUp(rank),r.id)||S.captain);
  orgFix();
}
function assignByDrop(r,tgtId,rank){
  const was=r.rank, wasBoss=r.boss;
  if(tgtId){const t=S.riders.find(x=>x.id===tgtId); if(!t||t===r) return '';
    if(t.rank==='trp'){moveRank(r,'trp',t.boss);}           /* onto a trooper: join their squad */
    else moveRank(r,rankDown(t.rank),t.id);}
  else if(rank) moveRank(r,rank,null);
  if(r.rank===was&&r.boss===wasBoss) return '';
  const b=S.riders.find(x=>x.id===r.boss);
  return r.rank==='cap'?r.name+' takes command of the band.':r.name+(r.rank!==was?' is now '+RANK_N[r.rank]:' now')+(b?', reporting to '+b.name:'')+'.';
}
function reportOpts(r){
  if(r.rank==='cap'||r.rank==='lt') return [];
  const want=rankUp(r.rank); let L=S.riders.filter(x=>x.rank===want);
  if(!L.length) L=S.riders.filter(x=>RANKS.indexOf(x.rank)<RANKS.indexOf(r.rank));
  return L;
}
function rankCtl(r,pre){
  if(!r||!r.rank) return '';
  const opts=reportOpts(r), boss=r.boss&&S.riders.find(x=>x.id===r.boss);
  let h='<div class="rankctl"><span class="pill rk-'+r.rank+'">'+RANK_N[r.rank]+'</span>';
  if(r.rank!=='cap') h+='<button class="sm" data-promote="'+r.id+'">'+(r.rank==='lt'?'Make captain':'Promote to '+RANK_N[rankUp(r.rank)])+'</button>';
  if(r.rank==='lt'||r.rank==='sgt') h+='<button class="sm" data-demote="'+r.id+'">Demote to '+RANK_N[rankDown(r.rank)]+'</button>';
  if(opts.length>1) h+='<label class="small muted" for="'+pre+'rep-'+r.id+'">Reports to</label><select id="'+pre+'rep-'+r.id+'" data-reports="'+r.id+'">'+opts.map(x=>'<option value="'+x.id+'"'+(x.id===r.boss?' selected':'')+'>'+esc(x.name)+' ('+RANK_N[x.rank]+')</option>').join('')+'</select>';
  else if(boss) h+='<span class="small muted">Reports to '+esc(boss.name)+'</span>';
  return h+'</div>';
}
function bindRank(root){
  root.querySelectorAll('[data-promote]').forEach(b=>b.onclick=()=>{const r=rider(b.dataset.promote);if(!r)return;const was=r.rank;promote(r);chron([r.name+(r.rank==='cap'?' takes command of the band.':' is promoted to '+RANK_N[r.rank]+'.')]);persist();render();});
  root.querySelectorAll('[data-demote]').forEach(b=>b.onclick=()=>{const r=rider(b.dataset.demote);if(!r)return;demote(r);chron([r.name+' is demoted to '+RANK_N[r.rank]+'.']);persist();render();});
  root.querySelectorAll('[data-reports]').forEach(sl=>sl.onchange=()=>{const r=rider(sl.dataset.reports);if(!r)return;r.boss=sl.value;orgFix();persist();render();});
}

/* ---------- chronicle: one entry per week ---------- */
function chron(lines){
  let e=S.log[0];
  if(!e||e.week!==S.week){const c=cal(S.week);e={week:S.week,season:c.season,year:c.year,lines:[]};S.log.unshift(e);}
  e.lines.push.apply(e.lines,lines);
}
function mergeLog(log){
  const out=[];
  (log||[]).forEach(e=>{const m=out.find(x=>x.week===e.week);if(m)m.lines=e.lines.concat(m.lines);else out.push({week:e.week,season:e.season,year:e.year,lines:e.lines.slice()});});
  return out.sort((a,b)=>b.week-a.week);
}
/* ---------- calendar ---------- */
function cal(week){
  const w=week-1, si=Math.floor(w/WEEKS_PER_SEASON)%4, year=Math.floor(w/(WEEKS_PER_SEASON*4))+1, wk=w%WEEKS_PER_SEASON+1;
  return {season:SEASONS[si],si,year,wk};
}

let S=null, slot=null, saves={}, db=null, uidKey=null, prefs={sort:'name',dir:1};
try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem(PREF)||'{}'));}catch(e){}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify(prefs));}catch(e){}}
try{saves=JSON.parse(localStorage.getItem(LOCAL)||'{}')||{};}catch(e){saves={};}
function writeLocal(){try{localStorage.setItem(LOCAL,JSON.stringify(saves));}catch(e){}}
let pending=Promise.resolve();
function persist(){
  if(!S||slot===null) return;
  S.savedAt=Date.now();
  saves[slot]=JSON.parse(JSON.stringify(S));
  writeLocal();
  if(db&&uidKey){
    const data={json:JSON.stringify(S),savedAt:S.savedAt};
    const ref=db.collection('data/users/'+uidKey).doc('slot'+slot);
    pending=pending.then(()=>ref.set(data)).catch(()=>toast('Couldn’t sync this save to your account. It’s kept in this browser.'));
  }
}
/* open a campaign and remember it as the last one played */
function rememberSlot(i){
  prefs.lastSlot=i; savePrefs();
  if(db&&uidKey) db.collection('data/users/'+uidKey).doc('prefs').set({lastSlot:i}).catch(()=>{});
}
function openSlot(i){
  if(!saves[i]) return;
  slot=i; savesOpen=false; draft=null;
  S=migrate(JSON.parse(JSON.stringify(saves[i]))); realmMigrate(); kitMigrate(); facMigrate(); familyMigrate(); if(!S.board) newBoard();
  tab='realm'; selected=null; detail=false;
  rememberSlot(i); render();
}
let touched=false;
async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d1,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d1||!u) return;
    const id=await u.id(); if(!id) return;
    db=d1; uidKey=id;
    let changed=false;
    for(let i=0;i<SLOTS;i++){
      try{
        const snap=await db.collection('data/users/'+uidKey).doc('slot'+i).get();
        const v=snap&&(typeof snap.data==='function'?snap.data():snap);
        if(v&&v.json){
          const remote=JSON.parse(v.json), local=saves[i];
          if(!local||(remote.savedAt||0)>(local.savedAt||0)){saves[i]=remote;changed=true;}
        }else if(v&&v.deleted&&saves[i]&&(saves[i].savedAt||0)<(v.savedAt||0)){delete saves[i];changed=true;}
      }catch(e){}
    }
    let last=null;
    try{const sn=await db.collection('data/users/'+uidKey).doc('prefs').get();const v=sn&&(typeof sn.data==='function'?sn.data():sn);if(v&&typeof v.lastSlot==='number')last=v.lastSlot;}catch(e){}
    if(changed) writeLocal();
    if(!touched){
      const want=last!==null&&saves[last]?last:(slot!==null?slot:null);
      if(want!==null&&(!S||want!==slot||(saves[want].savedAt||0)>(S.savedAt||0))) openSlot(want);
      else if(changed&&!S) render();
    }else if(changed&&!S) render();
  }catch(e){}
}

/* ---------- weekly turn ---------- */
function endWeek(){
  mapSel=null; /* the province panel snaps back to wherever the band is */
  const lines=[], news=[];
  const stayed=S.riders.filter(r=>r.status==='ready'&&!onQuestThisWeek(r));
  const onRoad=!!(S.map&&S.moveTo);
  S.storm=false;
  if(onRoad) roadEvent(news);
  const st=S.map?cur().settle:null;
  S.riders.forEach(r=>{
    const mon=perk()==='monastery'&&!(st.fever&&st.fever>S.week);
    const heal=S.storm?0:1+(mon||r.spec==='S9'?1:0)+(hasBoon(r,'B4')?1:0)+(trade(r)==='herbalist'?1:0);
    if(r.wounds>0&&heal){const h=Math.min(heal,r.wounds);r.wounds-=h;lines.push(r.name+' mends '+(h===1?'a wound':h+' wounds')+' ('+r.wounds+' of '+capacity(r)+').');}
    const reps=1+(perk()==='castle'||r.spec==='S11'?1:0)+(hasBoon(r,'B6')?1:0);
    for(let i=0;i<reps;i++) if(r.status==='ready'&&!onQuestThisWeek(r)&&r.train.length){
      const k=r.train.shift();
      if(r.st[k]<STAT_CAP){r.st[k]++;lines.push(r.name+'’s training pays off: '+STATN[k]+' rises to '+r.st[k]+'.');}
    }
  });
  captivesTick(lines);
  meetTick(stayed,lines);
  if(S.map){
    /* strikes from factions within one road */
    reachFacs().forEach(f=>{if(rnd(100)<f.host*5) strike(f,stayed.filter(r=>S.riders.includes(r)),news);});
    S.calls=(S.calls||[]).filter(c=>{if(c.until&&c.until<=S.week+1){if(c.guard)news.push('The locals gave up waiting for help.');return false;}return true;});
  }
  if(S.moveTo){const to=S.moveTo;S.moveTo=null;S.travelling=false;arrive(to,lines);}
  if(S.recruits){lines.push('The candidates who weren’t hired drift away.');S.recruits=null;}
  if(S.map){const n=d(3)===3?2:1;for(let i=0;i<n;i++) worldEvent(news);}
  claimTick(news);
  if(S.roadRecruit){S.recruits={diff:0,cands:[S.roadRecruit]};S.roadRecruit=null;}
  const before=cal(S.week);
  const hadNews=S.log[0]&&S.log[0].week===S.week;
  if(!lines.length&&!hadNews&&!news.length) lines.push('A quiet week at camp.');
  chron(lines.concat(news));
  S.week++;
  const after=cal(S.week);
  if(after.si!==before.si){S.log[0].lines.push(after.season+' comes'+(after.year!==before.year?', and with it year '+after.year:'')+'.');{const fl=[];familySeason(fl,after.year!==before.year);if(fl.length){news.push.apply(news,fl);S.log[0].lines.push.apply(S.log[0].lines,fl);}}if(S.map){const sl=[];seasonTick(sl);if(sl.length){news.push.apply(news,sl);S.log[0].lines.push.apply(S.log[0].lines,sl);}}}
  S.news={week:S.week-1,lines:news};
  S.boardBuys=0; newBoard();
  persist(); render();
  toast('Week '+(S.week-1)+' is done. Its news is on the Realm tab.');
}

function freeCaptive(c){

function makeCandidates(diff,partial,better,force){
  const taken=new Set(S.riders.map(r=>r.name)), out=[];
  for(let i=0;i<3;i++){
    let tier=wroll(TIER_ODDS[diff]);
    if(partial) tier=Math.max(0,tier-1);
    if(better) tier=Math.min(3,tier+1);
    if(S.map&&cur().settle.fair) tier=Math.min(3,tier+1);
    if(i===0&&force!==undefined) tier=force;
    const r=newRider(tier,taken); taken.add(r.name);
    let pts=TIER_PTS[tier][diff]+Math.min(S.sway||0,SWAY_CAP);
    while(pts>0){const open=STATS.filter(k=>r.st[k]<STAT_CAP);if(!open.length)break;r.st[pick(open)]++;pts--;}
    r.weapon=TIER_WEAPON[tier]; r.armor=TIER_ARMOR[tier]; nameGear(r);
    if(tier===2) r.relics.push('R'+(9+rnd(8)));
    if(tier===3) r.relics.push('R'+(1+rnd(5)));
    if(S.map&&perk()==='castle'){const best=STATS.slice().sort((a,b)=>r.st[b]-r.st[a])[0];if(r.st[best]<STAT_CAP)r.st[best]++;}
    r.fee=S.map?feeMod(FEE[tier](diff+1)):FEE[tier](diff+1);
    out.push(r);
  }
  return out;
}
function captivesTick(lines){
  S.captives.slice().forEach(c=>{
    const tries=(c.r.spec==='S6'?1:0)+(hasBoon(c.r,'B7')?1:0)+(c.r.comp==='C7'?1:0);
    for(let i=0;i<tries;i++) if(d(2)===1){freeCaptive(c);lines.push(c.r.name+' slips their captors at '+c.where+' and rides back to the band.');return;}
    if(S.week-c.week>=CAPTIVE_WEEKS){
      S.captives=S.captives.filter(x=>x!==c);
      c.r.status='fallen';c.r.fellWeek=S.week;c.r.cause='Lost in captivity';S.fallen.unshift(c.r);
      lines.push(c.r.name+' was held too long and is lost.');onFall(c.r,lines);
    }
  });
}

/* what a rider brings to a stage, part by part, for the roll buttons */
function targetParts(r,stat,q,assist){
  const P=[STATN[stat]+' '+r.st[stat]];
  if(stat==='mig'&&r.weapon) P.push('weapon +'+(r.weapon+heirG(r,'weapon'))+(heirG(r,'weapon')?' (heirloom)':''));
  if(assist) P.push('team +'+assist);
  r.relics.forEach(id=>{const x=RELICS[id];if(x&&(x[1]===stat||x[1]===q.type))P.push('relic +'+(1+heirG(r,'relic'))+(heirG(r,'relic')?' (heirloom)':''));});
  if(r.spec&&SPECS[r.spec]&&SPECS[r.spec][1]===q.type) P.push('specialist +1');
  if(r.comp&&COMPS[r.comp]&&COMPS[r.comp][1]===q.type) P.push(compName(r.comp).toLowerCase()+' +1');

  if(DIFF_ADJ[q.diff]) P.push('danger −'+DIFF_ADJ[q.diff]);

function realmMigrate(){

    if(b.what==='Discovered location'){const p=cur(),u=p.sites.find(x=>x.kind==='unexplored');chron(['From an earlier scouting report: '+reveal(p,u)+'.']);}

function migrate(s){
  s.board=s.board||null; s.captives=s.captives||[]; s.banked=s.banked||[];
  s.log=mergeLog(s.log); s.quest=s.quest||null; s.moveTo=s.moveTo||null; s.travelling=!!s.travelling; s.recruits=s.recruits||null; s.boardBuys=s.boardBuys||0;

}

/* large hand-placed art drawn on top of the fill, sized to the hex radius r */
function biomeArt(k,x,y,r,rot){
  const u=r/34, P=(dx,dy)=>(x+dx*u).toFixed(1)+' '+(y+dy*u).toFixed(1);
  if(k==='foothills'){
    const peaks=[[-12,-4,13],[9,-9,11],[12,12,12],[-6,15,10]];
    return peaks.map(p=>{const [dx,dy,h]=p,w=h*0.95;
      return '<path d="M'+P(dx-w,dy+h*.55)+' L'+P(dx,dy-h*.75)+' L'+P(dx+w,dy+h*.55)+'Z" fill="#5f5648" stroke="#4a4236" stroke-width="'+(1*u).toFixed(1)+'"/>'+
        '<path d="M'+P(dx,dy-h*.75)+' L'+P(dx+w*.35,dy-h*.75+h*.45)+' L'+P(dx+w*.08,dy-h*.75+h*.36)+' L'+P(dx-w*.12,dy-h*.75+h*.5)+' L'+P(dx-w*.35,dy-h*.75+h*.45)+'Z" fill="#f1efe6"/>';}).join('');
  }
  if(k==='moor'){
    const lochs=[[-11,-6,11,7,-15],[11,4,12,6.5,20],[-4,15,9,5.5,5]];
    return lochs.map(l=>'<ellipse cx="'+(x+l[0]*u).toFixed(1)+'" cy="'+(y+l[1]*u).toFixed(1)+'" rx="'+(l[2]*u).toFixed(1)+'" ry="'+(l[3]*u).toFixed(1)+'" transform="rotate('+l[4]+' '+(x+l[0]*u).toFixed(1)+' '+(y+l[1]*u).toFixed(1)+')" fill="#5d7f99" stroke="#3f5f78" stroke-width="'+(1*u).toFixed(1)+'"/><path d="M'+P(l[0]-l[2]*.4,l[1]-1)+' h'+(l[2]*.5*u).toFixed(1)+'" stroke="#a9c3d6" stroke-width="'+(1.2*u).toFixed(1)+'" stroke-linecap="round"/>').join('');
  }
  if(k==='coast'){
    /* land on the west, a jagged cliff edge, sea to the east */
    const edge=[[2,-40],[-3,-28],[3,-18],[-2,-8],[4,2],[-1,12],[5,22],[0,32],[3,40]];
    const land='M'+P(-40,-40)+' L'+edge.map(e=>P(e[0],e[1])).join(' L')+' L'+P(-40,40)+'Z';
    const face='M'+edge.map(e=>P(e[0],e[1])).join(' L')+' L'+edge.slice().reverse().map(e=>P(e[0]+4,e[1])).join(' L')+'Z';
    return '<g transform="rotate('+(rot||0).toFixed(1)+' '+x+' '+y+')"><path d="'+face+'" fill="#7a6a4c"/><path d="'+land+'" fill="#c9bf8f"/><path d="M'+edge.map(e=>P(e[0],e[1])).join(' L')+'" fill="none" stroke="#5f5240" stroke-width="'+(1.4*u).toFixed(1)+'"/>'+
      '<path d="M'+P(-24,-14)+' l'+(3*u).toFixed(1)+' '+(-3*u).toFixed(1)+' l'+(3*u).toFixed(1)+' '+(3*u).toFixed(1)+' M'+P(-16,10)+' l'+(3*u).toFixed(1)+' '+(-3*u).toFixed(1)+' l'+(3*u).toFixed(1)+' '+(3*u).toFixed(1)+'" fill="none" stroke="#8f8455" stroke-width="'+(1.1*u).toFixed(1)+'"/></g>';
  }
  if(k==='valley'){
    const riv=(o)=>'<path d="M'+P(-36,-14+o)+' C'+P(-18,-28+o)+' '+P(-8,4+o)+' '+P(4,-6+o)+' S'+P(24,6+o)+' '+P(36,-4+o)+'" fill="none" stroke="#5d88a5" stroke-width="'+(3.2*u).toFixed(1)+'" stroke-linecap="round"/>';
    return riv(0)+riv(16);
  }
  return '';
}
function biomeDefs(){
  return '<defs>'+Object.keys(BIOME_ART).map(k=>{const b=BIOME_ART[k];
    return '<pattern id="bio-'+k+'" patternUnits="userSpaceOnUse" width="'+b.s+'" height="'+b.s+'"><rect width="'+b.s+'" height="'+b.s+'" fill="'+b.bg+'"/><g fill="'+b.ink+'" stroke="'+b.ink+'">'+b.p+'</g></pattern>';}).join('')+'</defs>';
}

function seaVal(q,r){const m=S.map.sea;if(!m)return -99;const v=m.axis==='q'?q:m.axis==='r'?r:-q-r;return m.sign*v;}

function seaAngle(){
  const ds=HEX.filter(h=>seaVal(h[0],h[1])===1&&true);
  let vx=0,vy=0;ds.forEach(h=>{const [x,y]=hexXY({q:h[0],r:h[1]}),l=Math.hypot(x,y);vx+=x/l;vy+=y/l;});
  return Math.atan2(vy,vx)*180/Math.PI;
}
function rollSea(line){S.map.sea={axis:pick(['q','r','s']),sign:pick([1,-1]),line};}
function seaMigrate(){
  if(S.map.sea) return;
  rollSea(0);
  const vals=Object.values(S.map.provs).map(p=>seaVal(p.q,p.r));
  S.map.sea.line=Math.max(...vals)+1;
  Object.values(S.map.provs).forEach(p=>{if(p.biome==='coast')p.biome=pick(Object.keys(BIOMES).filter(k=>k!=='coast'));});
}

function uniqueName(a,b,used,sep){let n,t=0;do{n=pick(a)+(sep||'')+pick(b);t++;}while(used.has(n)&&t<30);return used.has(n)?n+' '+d(9):n;}
function provAt(q,r){return Object.values(S.map.provs).find(p=>p.q===q&&p.r===r);}
function newProv(q,r){
  const used=new Set(Object.values(S.map.provs).map(p=>p.name)), usedS=new Set(Object.values(S.map.provs).map(p=>p.settle.name));
  const stype=wroll(Object.keys(STYPES).map(k=>[k,STYPES[k].w]));
  const p={id:uid(),q,r,name:uniqueName(PROV_A,PROV_B,used,' '),biome:S.map.sea&&seaVal(q,r)===S.map.sea.line?'coast':pick(Object.keys(BIOMES).filter(k=>k!=='coast')),
    features:[pick(FEATURES)],adj:[],visited:false,expanded:false,
    settle:{name:uniqueName(SET_A,SET_B,usedS,''),type:stype,allied:false,boon:false},sites:[]};
  const fs=FEATURES.filter(f=>f!==p.features[0]); if(d(2)===2) p.features.push(pick(fs));
  const nl=1+rnd(2), nu=1+rnd(2), lm=LANDMARKS.slice();
  for(let i=0;i<nl;i++) p.sites.push({id:uid(),kind:'landmark',name:cap1(lm.splice(rnd(lm.length),1)[0])});
  for(let i=0;i<nu;i++) p.sites.push({id:uid(),kind:'unexplored',name:'An unexplored mark'});
  S.map.provs[p.id]=p; facProv(p); return p;
}
function link(a,b){if(a.adj.indexOf(b.id)<0)a.adj.push(b.id);if(b.adj.indexOf(a.id)<0)b.adj.push(a.id);}
/* arriving somewhere new rolls 1–3 unseen neighbours on the hex grid */
function expand(p){
  if(p.expanded) return []; p.expanded=true;
  const open=HEX.map(h=>[p.q+h[0],p.r+h[1]]).filter(c=>!provAt(c[0],c[1])&&(!S.map.sea||seaVal(c[0],c[1])<=S.map.sea.line));
  const made=[]; let n=1+rnd(3);
  while(n-->0&&open.length){const c=open.splice(rnd(open.length),1)[0];const np=newProv(c[0],c[1]);link(p,np);made.push(np);}
  /* an existing neighbour on the grid sometimes shares a road */
  HEX.forEach(h=>{const o=provAt(p.q+h[0],p.r+h[1]);if(o&&o.adj.indexOf(p.id)<0&&d(3)===3)link(p,o);});
  if(!p.adj.length){const any=HEX.map(h=>provAt(p.q+h[0],p.r+h[1])).filter(Boolean);if(any.length)link(p,any[0]);}
  return made;
}
function cur(){return S.map.provs[S.map.pos];}
function curType(){return STYPES[cur().settle.type];}
function dist(a,b){
  if(a===b) return 0; const seen={[a]:1}; let f=[a],k=0;
  while(f.length){k++;const nx=[];for(const id of f)for(const n of S.map.provs[id].adj){if(seen[n])continue;if(n===b)return k;seen[n]=1;nx.push(n);}f=nx;}
  return 99;
}
function arrive(id,lines){
  S.map.pos=id; const p=cur(); const first=!p.visited; p.visited=true;
  const made=expand(p); townCalls(p);
  lines.push('The band arrives in '+p.name+', at '+p.settle.name+' ('+STYPES[p.settle.type].n+').'+(made.length?' Word comes of '+made.map(x=>x.name).join(', ')+' beyond.':''));
}
function initMap(){
  S.map={provs:{},pos:null};

  const p=newProv(0,0); p.visited=true; S.map.pos=p.id; expand(p);
}
/* Scout reveal: Delve 30 / Stronghold 30 / Landmark 30 / Settlement 10; no hidden Stronghold → Delve */
function reveal(p,site){
  const hiddenHold=p.sites.some(s=>s.kind==='stronghold'&&s.hidden);
  let k=wroll([['delve',30],['stronghold',30],['landmark',30],['settlement',10]]);
  if(k==='stronghold'&&!hiddenHold) k='delve';
  if(k==='stronghold'){const h=p.sites.find(s=>s.kind==='stronghold'&&s.hidden);h.hidden=false;if(site)p.sites=p.sites.filter(s=>s!==site);return 'the hidden stronghold of '+h.name;}
  if(!site){site={id:uid()};p.sites.push(site);}
  if(k==='delve'){site.kind='delve';site.name=cap1(pick(DELVES))+' at '+pick(SET_A)+pick(PLACE_B);site.depth=1;site.cleared=false;}
  else if(k==='landmark'){site.kind='landmark';site.name=cap1(pick(LANDMARKS));}
  else{site.kind='settlement';const usedS=new Set(Object.values(S.map.provs).map(x=>x.settle.name));site.name=uniqueName(SET_A,SET_B,usedS,'');site.stype=wroll(Object.keys(STYPES).map(t=>[t,STYPES[t].w]));}
  return site.kind==='settlement'?'a hidden settlement, '+site.name+' ('+STYPES[site.stype].n+')':(site.kind==='delve'?'a delve: ':'a landmark: ')+site.name;
}
const delveDiff=depth=>depth<=2?0:depth<=4?1:2;

function placeOffer(o){
  const p=cur(); o.prov=p.id;
  const holds=p.sites.filter(s=>s.kind==='stronghold'&&!s.hidden).map(s=>({s,f:facById(s.fac)})).filter(x=>x.f&&x.f.alive);
  if(o.type==='raid'){
    const t=holds.filter(x=>x.f.kind!=='brood'); if(!t.length){o.noBase=true;return o;}
    const x=pick(t), r=makeOffer('raid',facDiff(x.f)); o.diff=r.diff; o.stages=r.stages; o.fac=x.f.id; o.title='Raid '+x.s.name; return o;
  }
  if(o.type==='track'){
    const t=holds.filter(x=>x.f.kind==='brood');
    if(t.length&&d(3)>1){const x=pick(t), r=makeOffer('track',facDiff(x.f)); o.diff=r.diff; o.stages=r.stages; o.fac=x.f.id; o.title='Track '+x.f.name+' to '+x.s.name; return o;}
  }
  const delves=p.sites.filter(s=>s.kind==='delve'&&!s.cleared), unexp=p.sites.filter(s=>s.kind==='unexplored'), lms=p.sites.filter(s=>s.kind==='landmark');
  if(o.type==='delve'&&delves.length){const s=pick(delves);o.site=s.id;o.depth=s.depth;o.title='Delve into '+s.name+', level '+s.depth;}
  else if(o.type==='retrieve'&&delves.length&&d(2)===2){const s=pick(delves);o.title=o.title.replace(/from .*$/,'from '+s.name);}
  else if(o.type==='scout'&&unexp.length){const s=pick(unexp);o.site=s.id;o.title='Scout an unexplored mark in '+p.name;}
  else if(o.type==='defend'){const tgt=lms.length&&d(3)===3?pick(lms).name.toLowerCase():p.settle.name;o.title='Defend '+tgt+' '+pick(['against raiders','from a night attack','until the levy arrives','at the ford']);}
  else if(o.type==='escort'){
    const range=o.diff+1, known=Object.values(S.map.provs).filter(x=>x.id!==p.id);

function tgtInfo(t){
  if(!t||!S.map||t.week!==S.week||t.prov!==cur().id) return null;
  const p=cur();
  if(t.kind==='site'){const s=p.sites.find(x=>x.id===t.id&&!x.hidden);if(!s)return null;
    if(s.kind==='delve')return s.cleared?null:{p,s,types:['delve','retrieve']};

    if(s.kind==='landmark')return {p,s,types:['defend','retrieve']};
    if(s.kind==='stronghold'){const f=facById(s.fac);if(!f||!f.alive)return null;return {p,s,f,types:f.kind==='brood'?['track']:['raid','rescue','retrieve']};}
    return null;}
  const f=(p.facs||[]).find(x=>x.id===t.id&&x.alive); if(!f) return null;
  const s=p.sites.find(x=>x.kind==='stronghold'&&x.fac===f.id&&!x.hidden);
  if(s) return {p,s,f,types:f.kind==='brood'?['track']:['raid','rescue','retrieve']};

const tgtTypes=t=>{const i=tgtInfo(t);return i?i.types:[];};
function targetOffer(){

  const o=makeOffer(type,fd); o.prov=p.id; o.tgt=true;
  if(f&&s&&type!=='scout') o.fac=f.id;
  if(type==='delve'){o.site=s.id;o.depth=s.depth;const nd=delveDiff(s.depth),r=makeOffer('delve',nd);o.diff=nd;o.stages=r.stages;o.title='Delve into '+sn+', level '+s.depth;}
  else if(type==='retrieve') o.title='Retrieve '+pick(LOOT)+' from '+sn;
  else if(type==='scout'&&s){o.site=s.id;o.title='Scout '+sn+' in '+p.name;}
  else if(type==='scout'){o.findFac=f.id;o.title='Scout for the '+FKINDS[f.kind].hold+' of '+f.name;}
  else if(type==='defend'&&s) o.title='Defend '+sn+' '+pick(['against raiders','from a night attack','until the levy arrives']);
  else if(type==='defend'){o.fac=f.id;o.title='Defend '+p.settle.name+' against '+f.name;}
  else if(type==='raid') o.title='Raid '+sn;
  else if(type==='rescue') o.title='Rescue '+pick(VICTIMS)+' held at '+sn;
  else if(type==='track'){o.fac=f.id;o.title='Track '+f.name+(s?' to '+sn:' near '+p.settle.name);}

}

function oneCand(tier,free){
  const taken=new Set(everyone().map(r=>r.name).concat(S.recruits?S.recruits.cands.map(c=>c.name):[]));
  const r=newRider(tier,taken); let pts=TIER_PTS[tier][0];
  while(pts>0){const open=STATS.filter(k=>r.st[k]<STAT_CAP);if(!open.length)break;r.st[pick(open)]++;pts--;}
  r.weapon=TIER_WEAPON[tier]; r.armor=TIER_ARMOR[tier]; nameGear(r);
  if(tier===2) r.relics.push('R'+(9+rnd(8))); if(tier===3) r.relics.push('R'+(1+rnd(5)));

function genStages(type,diff,pool){
  const T=QTYPES[type]; pool=pool||T.pool;
  const prim=pool.filter(o=>o[1]===T.prim), oth=pool.filter(o=>o[1]!==T.prim);
  const n=DIFF_STAGES[diff], stages=[], need=Math.ceil(n/2), bag=prim.slice();
  for(let i=0;i<need&&bag.length;i++) stages.push(bag.splice(rnd(bag.length),1)[0]);
  const rest=bag.concat(oth);
  while(stages.length<n&&rest.length) stages.push(rest.splice(rnd(rest.length),1)[0]);
  stages.sort(()=>Math.random()-.5);
  return stages.map(s=>({n:s[0],st:s[1]}));
}
function applyVariant(o,k,ctx){
  const V=VARIANTS[o.type][k]; ctx=ctx||{}; o.v=k;
  if(ctx.fac) o.fac=ctx.fac.id;
  if(V.diff!==undefined) o.diff=V.diff; else if(ctx.fac) o.diff=facDiff(ctx.fac);
  if(!V.keepSite){delete o.site;delete o.depth;}
  if(!V.keepDest) delete o.dest;
  if(V.prep) V.prep(o,ctx);
  if(V.bonus) o.bonus=V.bonus;
  delete o.noBase; delete o.findFac;
  o.stages=genStages(o.type,o.diff,V.pool);
  o.title=V.title(o,ctx);
  return o;
}
function variantCtx(o,k){
  const V=VARIANTS[o.type][k]; const ctx={};
  if(V.kinds){const fs=reachFacs().filter(f=>V.kinds.includes(f.kind)&&(!V.facOk||V.facOk(f)));if(!fs.length)return null;ctx.fac=V.facPref?V.facPref(fs):pick(fs);}
  if(V.ok&&!V.ok(o,ctx)) return null;
  return ctx;
}
/* weighted by context: the base quest 2; each variant whose condition is met 3 (some more or less) */
function variantize(o){
  if(!S.map||!o) return o;
  if(o.fac&&o.type!=='raid') return o;
  const V=VARIANTS[o.type]||{}, opts=[[null,o.noBase?0:2,null]];
  Object.keys(V).forEach(k=>{if(V[k].manual)return;const c=variantCtx(o,k);if(c)opts.push([k,V[k].w?V[k].w(o,c):3,c]);});
  const tot=opts.reduce((a,x)=>a+x[1],0); if(!tot) return null;
  let r=rnd(tot), ch=opts[0];
  for(const x of opts){if(r<x[1]){ch=x;break;}r-=x[1];}
  if(!ch[0]){delete o.noBase;return o;}
  return applyVariant(o,ch[0],ch[2]);
}

function treeHTML(){
  const seen=new Set();
  const node=x=>{
    if(seen.has(x.id)) return ''; seen.add(x.id);
    const kid=S.kids.includes(x), p=kid?null:partnerOf(x); if(p) seen.add(p.id);
    let line='<b class="fell">'+esc(x.name)+'</b> <span class="small muted">'+esc(ageLine(x))+'</span>';
    if(!kid&&x.partner) line+=' <span class="small">♥ '+(p?'<b class="fell">'+esc(p.name)+'</b> <span class="muted">'+esc(ageLine(p))+'</span>':esc(x.partner.name)+(x.partner.dead?' <span class="muted">†</span>':''))+'</span>';
    if(!kid&&x.widowOf) line+=' <span class="small muted">· widowed</span>';
    const ch=kid?[]:childrenOf(x.id).concat(p?childrenOf(p.id):[]).filter((c,i,a)=>a.indexOf(c)===i);
    return '<li>'+line+(ch.length?'<ul>'+ch.map(node).join('')+'</ul>':'')+'</li>';
  };

}

/* choices waiting on the player: bond moments, firesides, childhood moments, heirs and wards (Realm tab) */
function promptValid(p){
  const R=id=>S.riders.find(x=>x.id===id);
  if(p.kind==='bond'){const a=R(p.a),b=R(p.b);return !!(a&&b&&!a.bonds[b.id]&&bondOpts(a,b).length);}
  if(p.kind==='turn'){const a=R(p.a),b=R(p.b);return !!(a&&b&&a.bonds[b.id]==='rival');}
  if(p.kind==='fireside'){const r=R(p.r);return !!(r&&slotFree(r,'sweet'));}
  if(p.kind==='grow'||p.kind==='heir'||(p.kind==='ward'&&p.kid)) return S.kids.some(k=>k.id===p.kid);
  if(p.kind==='ward') return !!p.held;
  return false;
}

    if(p.kind==='grow'){const k=promptKid(p);k.growD=k.growD||{};k.growD[ch]=(k.growD[ch]||0)+1;return done([k.name+' grows '+({mig:'strong',sta:'hardy',tec:'deft',ins:'sharp',eti:'well-spoken'}[ch])+': +d6 '+STATN[ch]+' when they come of age.']);}
    if(p.kind==='heir'){const k=promptKid(p),ls=[];S.prompts=S.prompts.filter(x=>x!==p);comeOfAge(k,ls,ch);chron(ls);persist();render();return;}
    if(p.kind==='ward'){placeWard(p,ch);persist();render();}
  });
  V.querySelectorAll('[data-pradopt]').forEach(sl=>sl.onchange=()=>{const p=P(sl.dataset.pradopt);if(p&&sl.value){placeWard(p,'adopt',sl.value);persist();render();}});

}

function sorted(){

  const q=r.train.length?'<ol class="queue">'+(()=>{const tmp={};return r.train.map((k,i)=>{tmp[k]=(tmp[k]||0)+1;const to=r.st[k]+tmp[k];return '<li><span>'+(i===0?'Next: ':'')+STATN[k]+' to '+to+'</span><span class="muted">'+(to-1)+' gold paid</span></li>';}).join('');})()+'</ol><p class="small muted">One +1 lands each week this rider stays behind instead of riding on a quest.</p>':'<p class="muted small">Nothing queued.</p>';
  return '<div class="panel"><button class="lnk back" id="back">← All riders</button>'+
   '<div class="dhead"><div class="bustcol">'+bust(r,true)+'<button class="lnk small" id="relook" title="Pick another portrait">New look</button></div><div style="flex:1;min-width:0"><label class="small muted" for="rname">Name</label><input class="nm" id="rname" maxlength="40" value="'+esc(r.name)+'"><div class="row small" style="margin-top:6px">'+status+(r.rank?' <span class="pill rk-'+r.rank+'">'+RANK_N[r.rank]+'</span>':'')+'</div></div></div>'+
   '<div class="sec"><h3>Profile</h3>'+statGrid(r)+'<dl class="kv"><dt>Wounds</dt><dd>'+r.wounds+' of '+c+' '+wbar(r)+'</dd><dt>Capacity</dt><dd>'+Math.floor(r.st.sta/2)+' from Stature '+r.st.sta+(r.armor?' + '+r.armor+' armour':'')+(r.relics.includes('R6')?' + '+(1+heirG(r,'relic'))+' mantle':'')+(trade(r)==='baker'?' + 1 fresh bread':'')+'</dd><dt>Age</dt><dd>'+r.age+(outNote(r)?' <span class="pill bad">'+esc(cap1(outNote(r)))+(r.outTo&&r.mourn!==S.week?' to week '+r.outTo:' this week')+'</span>':'')+(grieving(r)?' <span class="pill bad">Grieving: −1 to rolls to week '+(r.griefTo-1)+'</span>':'')+'</dd><dt>Joined</dt><dd>Week '+r.joined+'</dd><dt>Scars</dt><dd>'+(r.scars.length?r.scars.map(esc).join('; '):'None')+'</dd></dl>'+
     '<h3 style="margin-top:12px">Rank</h3>'+rankCtl(r,'d')+'</div>'+
   kitSec(r)+histSec(r)+
   '<div class="sec"><h3>Training queue</h3>'+q+'<p class="small muted">Buy a +1: costs gold equal to the stat it raises from. You have '+S.gold+' gold.</p><div class="trainbtns">'+STATS.map(k=>{const p=projected(r,k),cost=trainCost(r,k),ok=p<STAT_CAP&&S.gold>=cost;return '<button data-train="'+k+'"'+(ok?'':' disabled')+' aria-label="Queue '+STATN[k]+' +1 for '+cost+' gold">'+STATA[k]+'<b>'+(p<STAT_CAP?p+'→'+(p+1):'max')+'</b>'+(p<STAT_CAP?cost+'g':'')+'</button>';}).join('')+'</div>'+(r.train.length?'<p><button class="lnk" id="unq">Cancel the last queued +1 (refund)</button></p>':'')+'</div>'+
   '</div>';
}
function viewFallen(){
  if(!S.fallen.length) return '<p class="lede">No one has fallen yet. Riders slain on quests are remembered here.</p>';
  return '<ul class="log">'+S.fallen.map(r=>'<li><div class="row">'+bust(r)+'<div><b>'+esc(r.name)+'</b><div class="small muted">'+TIERS[r.tier]+(typeof r.age==='number'?' · age '+r.age:'')+' · rode from week '+r.joined+' to week '+r.fellWeek+(r.cause?' · '+esc(r.cause):'')+'</div></div></div></li>').join('')+'</ul>';
}
const LORE=['Annum 447, the final heir to the line of Ulrich, the servant-king of all, perished.','Mighty provinces, bound together by honor and oaths, became fractured and dissolved by dishonor and betrayal.','Darkness descended upon the lands and an age of ignorance, isolation, fear, and war stripped cathedrals of their dignity, knights of their chivalry, and lords of their duty.','You are a NoonChaser — one who chooses to ride against the dark, and seek the last bit of light in a land filled with darkness.'];
function viewChron(){
  const H=S.history||[], f=H.filter(x=>x.grade==='full').length, p=H.filter(x=>x.grade==='partial').length;
  const gold=H.reduce((a,x)=>a+(x.gold||0),0);
  let h='<h2>Chronicle</h2><div class="panel"><label class="small muted" for="bandName" style="display:block">The band</label><input class="nm" id="bandName" maxlength="50" value="'+esc(S.band)+'">'+
    '<details class="fold" data-fold="lore"'+(foldOpen('lore')?' open':'')+'><summary><h3 style="display:inline">Lore</h3></summary>'+LORE.map(t=>'<p class="lore">'+esc(t)+'</p>').join('')+'</details></div>';
  h+='<details class="qsec fold" data-fold="chist"'+(foldOpen('chist')?' open':'')+'><summary><h2 style="display:inline">Campaign history</h2></summary>';
  h+=H.length?'<p class="small muted">'+H.length+' quest'+(H.length>1?'s':'')+': '+f+' full, '+p+' partial, '+(H.length-f-p)+' failed. '+gold+' gold earned. '+S.fallen.length+' fallen.</p><ul class="log hist">'+H.slice().reverse().map(x=>'<li><b>Week '+x.w+'</b> <span class="small muted">'+QTYPES[x.type].n+' · '+DIFFS[x.diff]+' · '+x.passed+' of '+x.n+' stages</span><br>'+esc(x.title)+' <span class="pill '+(x.grade==='full'?'ok':x.grade==='fail'?'bad':'')+'">'+GRADE_N[x.grade]+'</span><div class="small muted">'+esc(x.riders.join(', '))+(x.gold?' · '+x.gold+' gold':'')+(x.renown?' · +'+x.renown+' renown':'')+(x.lost.length?' · lost '+esc(x.lost.join(', ')):'')+'</div></li>').join('')+'</ul>':'<p class="muted small">No quests ridden yet.</p>';
  h+='</details><details class="qsec fold" data-fold="clog"'+(foldOpen('clog')?' open':'')+'><summary><h2 style="display:inline">Weekly news</h2></summary>';
  h+=S.log.length?'<ul class="log">'+S.log.map(e=>'<li><b>Week '+e.week+'</b> <span class="small muted">'+e.season+', year '+e.year+'</span><ul>'+e.lines.map(l=>'<li style="border:0;padding:2px 0">'+esc(l)+'</li>').join('')+'</ul></li>').join('')+'</ul>':'<p class="lede">Each week’s news lands here when you end the week.</p>';
  return h+'</details>';
}
function bindChron(V){
  const bn=$('#bandName'); if(bn) bn.onchange=()=>{const v=bn.value.trim();if(v){S.band=v;persist();header();}else bn.value=S.band;};
  V.querySelectorAll('details.fold[data-fold]').forEach(dd=>dd.addEventListener('toggle',()=>{prefs.folds=prefs.folds||{};prefs.folds[dd.dataset.fold]=dd.open;savePrefs();}));
}

/* ---------- roster drag to reorder (mouse and touch, via pointer events) ---------- */
let dragJust=false;
/* Rows are measured once when a drag starts. The dragged row follows the pointer with a transform, the
   others slide aside with transforms, and the list is only reordered (once) on drop: no layout churn,
   no slot flip-flopping, no full redraw. */
function bindDrag(V){
  const list=V.querySelector('.rlist'); if(!list) return;
  list.querySelectorAll('[data-grip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      if(e.button>0||list.classList.contains('drag')) return;
      e.preventDefault(); e.stopPropagation();
      const row=g.closest('.rrow'), rows=[...list.querySelectorAll('.rrow')], from=rows.indexOf(row);
      const sy=()=>window.scrollY||document.documentElement.scrollTop||0;
      const tops=rows.map(x=>x.getBoundingClientRect().top+sy()), hs=rows.map(x=>x.getBoundingClientRect().height);
      const h=hs[from], startPage=e.clientY+sy(), mids=tops.map((t,k)=>t+hs[k]/2);
      const firstTop=tops[0], lastBottom=tops[tops.length-1]+hs[hs.length-1];
      let moved=false, to=from, lastY=e.clientY, raf=0, dy=0;
      try{g.setPointerCapture(e.pointerId);}catch(_){}
      const frame=()=>{
        raf=0;
        /* auto-scroll near the top or bottom edge of the screen */
        const edge=48, vh=window.innerHeight;
        let sc=0; if(lastY<edge) sc=-Math.ceil((edge-lastY)/4); else if(lastY>vh-edge) sc=Math.ceil((lastY-(vh-edge))/4);
        if(sc) window.scrollBy(0,sc);
        dy=lastY+sy()-startPage;
        /* keep the row within the list */
        dy=Math.max(firstTop-tops[from],Math.min(lastBottom-(tops[from]+h),dy));
        row.style.transform='translateY('+dy+'px)';
        const c=tops[from]+h/2+dy;
        to=0; for(let k=0;k<rows.length;k++){if(k===from)continue;if(c>mids[k])to++;}
        rows.forEach((x,k)=>{if(k===from)return;
          const sh=(k>from&&k<=to)?-h:(k<from&&k>=to)?h:0;
          x.style.transform=sh?'translateY('+sh+'px)':'';});
        if(sc) raf=requestAnimationFrame(frame);
      };
      const move=ev=>{
        if(ev.pointerId!==e.pointerId) return; ev.preventDefault();
        lastY=ev.clientY;
        if(!moved){if(Math.abs(ev.clientY+sy()-startPage)<4)return;
          moved=true;row.classList.add('dragging');list.classList.add('drag');document.body.classList.add('dragging');}
        if(!raf) raf=requestAnimationFrame(frame);
      };
      const up=ev=>{
        if(ev.pointerId!==e.pointerId) return;
        g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up);
        try{g.releasePointerCapture(e.pointerId);}catch(_){}
        if(raf){cancelAnimationFrame(raf);raf=0;}
        if(!moved) return;
        dragJust=true; setTimeout(()=>{dragJust=false;},80);
        const before=row.getBoundingClientRect().top;
        list.classList.remove('drag'); document.body.classList.remove('dragging');
        rows.forEach(x=>{x.style.transition='none';x.style.transform='';});
        const order=rows.filter(x=>x!==row); order.splice(to,0,row); order.forEach(x=>list.appendChild(x));
        /* slide the dropped row from where it was let go into its slot */
        const after=row.getBoundingClientRect().top;
        row.style.transform='translateY('+(before-after)+'px)';
        void row.offsetHeight;
        row.style.transition='transform .15s ease'; row.style.transform='';
        setTimeout(()=>{row.classList.remove('dragging');rows.forEach(x=>{x.style.transition='';});},170);
        if(to===from&&prefs.sort==='manual') return;
        S.order=order.map(x=>x.dataset.sel);
        prefs.sort='manual'; savePrefs(); persist();
        V.querySelectorAll('[data-sort]').forEach(b=>{const on=b.dataset.sort==='manual';b.setAttribute('aria-pressed',on);b.textContent=b.textContent.replace(/ [↑↓]$/,'');});
      };
      g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
    });
  });
}

/* ---------- bindings ---------- */
function startDraft(i){
  const riders=[],taken=new Set();
  for(let k=0;k<4;k++){const r=newRider(0,taken);taken.add(r.name);riders.push(r);}
  draft={slot:i,band:bandName(),riders};
}
function bind(){
  const V=$('#view');
  V.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.new;
    const go=()=>{savesOpen=false;S=null;slot=null;startDraft(i);render();};
    go();
  });
  V.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>openSlot(+b.dataset.load));
  V.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.del;
    confirmBox('Delete '+saves[i].band+'? This can’t be undone.','Delete',()=>{
      delete saves[i];writeLocal();
      if(db&&uidKey){db.collection('data/users/'+uidKey).doc('slot'+i).set({deleted:true,savedAt:Date.now()}).catch(()=>{});}
      if(slot===i){S=null;slot=null;}
      if(prefs.lastSlot===i){prefs.lastSlot=null;savePrefs();}
      render();
    });
  });
  if(draft&&!S){
    const bn=$('#bandName'); if(bn) bn.oninput=()=>{draft.band=bn.value;};
    $('#rerollBand').onclick=()=>{draft.band=bandName();render();};
    V.querySelectorAll('[data-reroll]').forEach(b=>b.onclick=()=>{const i=+b.dataset.reroll;const taken=new Set(draft.riders.map(r=>r.name));draft.riders[i]=newRider(0,taken);render();});
    $('#rerollAll').onclick=()=>{startDraft(draft.slot);render();};
    $('#cancelNew').onclick=()=>{draft=null;render();};
    $('#startCamp').onclick=()=>{
      S={v:2,band:(draft.band||'').trim()||bandName(),week:1,gold:START_GOLD,renown:0,riders:draft.riders,fallen:[],log:[],captain:null,savedAt:0};
      S.riders.forEach(r=>r.joined=1);
      S.captain=S.riders[0].id;
      slot=draft.slot; draft=null; tab='realm'; selected=null; rememberSlot(slot);
      migrate(S); initMap(); kitMigrate(); facMigrate(); familyMigrate(); newBoard();
      persist(); render();
    };
  }
  if(!S) return;
  if(tab==='realm'){bindQuests(V);bindRealm(V);}
  if(tab==='market') bindMarket(V);
  if(tab==='roster') bindFamily(V);
  if(tab==='chron') bindChron(V);
  const rv=$('#rview'); if(rv) rv.onclick=e=>{rosterView=rosterView==='fallen'?'riders':'fallen';detail=false;render();};
  bindKit(V);
  V.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.sort;
    if(prefs.sort===k) prefs.dir=-prefs.dir; else {prefs.sort=k;prefs.dir=(k==='name'||k==='wounds')?1:-1;}
    savePrefs(); render();
  });
  bindDrag(V);
  V.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{if(dragJust){dragJust=false;return;}selected=b.dataset.sel;detail=true;render();if(window.matchMedia('(max-width:760px)').matches)window.scrollTo(0,0);});
  const r=S.riders.find(x=>x.id===selected);
  const back=$('#back'); if(back) back.onclick=()=>{detail=false;render();};
  const rn=$('#rname');
  if(rn&&r) rn.onchange=()=>{const v=rn.value.trim();if(v){r.name=v;persist();render();}else rn.value=r.name;};
  bindRank(V.querySelector('.dossier')||V);
  const rl=$('#relook'); if(rl&&r) rl.onclick=()=>{r.look=pickLook(r.sex,r.look);persist();render();};
  V.querySelectorAll('details.fold[data-fold]').forEach(dd=>dd.addEventListener('toggle',()=>{prefs.folds=prefs.folds||{};prefs.folds[dd.dataset.fold]=dd.open;savePrefs();}));
  V.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.train, cost=trainCost(r,k);
    if(projected(r,k)>=STAT_CAP||S.gold<cost) return;
    S.gold-=cost; r.train.push(k); persist(); render();
    toast(STATN[k]+' +1 queued for '+r.name+' ('+cost+' gold).');
  });
  const un=$('#unq'); if(un&&r) un.onclick=()=>{
    const k=r.train.pop(); const refund=projected(r,k); S.gold+=refund; persist(); render();
    toast('Refunded '+refund+' gold.');
  };
}

if(typeof prefs.lastSlot==='number'&&saves[prefs.lastSlot]) openSlot(prefs.lastSlot); else render();
document.addEventListener('click',()=>{touched=true;},{capture:true,once:true});
connect();
window.addEventListener('pagehide',()=>{if(S)persist();});
})();
</script>
